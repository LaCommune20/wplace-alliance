<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quartier Général Tactique - Wplace</title>
    <link rel="stylesheet" href="https://cloudflare.com" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; background: #121212; color: #fff; overflow: hidden; }
        #map { height: 100vh; width: 100%; position: absolute; top:0; bottom:0; left:0; right:0; z-index: 1; }
        
        .tactical-panel { background: rgba(20, 20, 20, 0.95); padding: 15px; border-radius: 8px; border: 1px solid #444; line-height: 24px; color: #fff; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.6); z-index: 1000; position: absolute; }
        .legend { bottom: 20px; right: 20px; width: 220px; }
        .legend h4 { margin: 0 0 8px 0; border-bottom: 1px solid #555; padding-bottom: 4px; text-transform: uppercase; font-size: 12px; letter-spacing: 1px; color: #FFD700; }
        .legend div { display: flex; align-items: center; margin-bottom: 4px; font-size: 12px; }
        .legend i { width: 14px; height: 14px; display: inline-block; margin-right: 10px; border-radius: 4px; border: 1px solid #fff; }
        
        .leaflet-popup-content-wrapper { background: #1c1c1c; color: #fff; border-radius: 6px; font-size: 12px; border: 1px solid #444; }
        .leaflet-popup-content { margin: 10px 14px; line-height: 18px; }
        .leaflet-popup-tip { background: #1c1c1c; border: 1px solid #444; }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- 📊 PANNEAU DE COMMANDEMENT STRATÉGIQUE -->
    <div class="tactical-panel legend">
        <h4>Codes Couleur État-Major</h4>
        <div><i style="background: rgba(255, 0, 0, 0.5); border-color: #FF0000;"></i> 🛑 Alerte Bot / Raid Intel</div>
        <div><i style="background: rgba(0, 162, 255, 0.3); border-color: #00A2FF;"></i> 🔨 Construction En Cours</div>
        <div><i style="background: rgba(0, 255, 0, 0.3); border-color: #00FF00;"></i> ✅ Objectif Terminé (Done)</div>
        <div><i style="background: rgba(0, 255, 0, 0.8); border-color: #fff;"></i> 💡 Actu / Infos (Bulle)</div>
        <div><i style="background: rgba(238, 130, 238, 0.4); border-color: #EE82EE;"></i> ⚠️ Fausse Alerte</div>
        <div><i style="background: rgba(148, 0, 211, 0.5); border-color: #9400D3;"></i> ☣️ Infiltration (+2000px)</div>
    </div>

    <script src="https://cloudflare.com"></script>

    <script>
        const SUPABASE_KEY = "sb_publishable_V_cQamZG0uZFy_xDwUkPUA_hf8q_1uL";
        const activeLayers = {};

        // 1. INITIALISATION DE LA CARTE EN COORDONNÉES PIXELS
        const map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: -3,
            maxZoom: 4,
        }).setView([0, 0], 1);

        // 2. REFRESH DE LA CARTE DE FOND WPLACE TOUTES LES 5 MINUTES (300000 ms)
        const wplaceTileUrl = "https://wplace.live{z}/{x}/{y}.png"; 
        let backgroundLayer = L.tileLayer(wplaceTileUrl, { noWrap: true, continuousWorld: true }).addTo(map);

        setInterval(() => {
            backgroundLayer.setUrl(wplaceTileUrl + "?update=" + Date.now());
            console.log("🔄 Fond de carte Wplace synchronisé !");
        }, 300000);

        // 3. DICTIONNAIRE STRATÉGIQUE DES COULEURS & OPACITÉS DES ZONES
        function getZoneStyle(type, status) {
            if (status === 'fausse_alerte') return { color: '#EE82EE', fill: '#EE82EE', opacity: 0.5 }; // Violet Clair
            if (status === 'infiltration') return { color: '#9400D3', fill: '#9400D3', opacity: 0.6 };   // Violet Sombre Brut
            
            if (type === 'grief') return { color: '#FF0000', fill: '#FF0000', opacity: 0.5 }; // Rouge Alerte
            if (type === 'build') return { color: '#00A2FF', fill: '#00A2FF', opacity: 0.3 }; // Bleu En cours
            if (type === 'done') return { color: '#00FF00', fill: '#00FF00', opacity: 0.3 };  // Vert Clôturé
            return { color: '#ffffff', fill: '#00FF00', opacity: 0.8 };                     // Bulles d'actus standard
        }

        // 4. INJECTION DES GRAPHISMES TACTIQUES SUR LA CARTE
        function drawTacticalZone(event) {
            if (activeLayers[event.id]) return;

            const style = getZoneStyle(event.type, event.status);
            let layer;

            // Si un rayon supérieur à 0 est donné, on dessine une surface circulaire (Zone)
            if (event.radius && event.radius > 0) {
                layer = L.circle([event.y, event.x], {
                    radius: event.radius,
                    color: style.color,
                    weight: 3,
                    fillColor: style.fill,
                    fillOpacity: style.opacity
                });
            } else {
                // Sinon c'est un point d'actualité ou un repère simple
                layer = L.circleMarker([event.y, event.x], {
                    radius: 12,
                    color: style.color,
                    weight: 2,
                    fillColor: style.fill,
                    fillOpacity: style.opacity
                });
            }

            // Génération de la fiche de renseignement au clic
            const popupContent = `
                <div style="font-family:sans-serif;">
                    <b style="color:${style.color}; text-transform:uppercase;">[${event.status ? event.status.toUpperCase() : event.type.toUpperCase()}] #${event.id}</b><br>
                    <b>Secteur :</b> X: ${event.x} | Y: ${event.y} ${event.radius ? `(Rayon: ${event.radius}px)` : ''}<br>
                    <b>Auteur Intel :</b> ${event.author || 'Système d\'alerte auto'}<br>
                    <hr style="border:0; border-top:1px solid #444; margin:6px 0;">
                    <i style="color:#ddd;">"${event.description}"</i>
                </div>
            `;

            layer.bindPopup(popupContent);
            layer.addTo(map);
            activeLayers[event.id] = layer;
        }

        // 5. SYNCHRONISATION EN TEMPS RÉEL DU SERVEUR DE DONNÉES
        async function fetchTacticalIntel() {
            try {
                const response = await fetch("https://supabase.co" + Date.now(), {
                    method: 'GET',
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                });
                const data = await response.json();

                // Gestion du nettoyage immédiat des zones si supprimées de la BDD
                const serverIds = data.map(e => e.id);
                Object.keys(activeLayers).forEach(id => {
                    if (!serverIds.includes(parseInt(id))) {
                        map.removeLayer(activeLayers[id]);
                        delete activeLayers[id];
                    }
                });

                data.forEach(event => drawTacticalZone(event));
            } catch (err) {
                console.error("Erreur de liaison tactique :", err);
            }
        }

        fetchTacticalIntel();
        setInterval(fetchTacticalIntel, 3000);
    </script>
</body>
</html>
