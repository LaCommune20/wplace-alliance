<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>WPlace Bergamottto</title>


    <!-- =========================================================
         MAPLIBRE
         ========================================================= -->

    <link
        href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css"
        rel="stylesheet"
    >

    <script
        src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js">
    </script>


    <!-- =========================================================
         STYLE
         ========================================================= -->

    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #111;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

        }


        #map {

            width: 100%;
            height: 100%;

        }


        /* =====================================================
           PANNEAU
           ===================================================== */

        #panel {

            position: absolute;

            top: 15px;
            left: 15px;

            z-index: 1000;

            min-width: 270px;

            padding: 14px 17px;

            background:
                rgba(15, 15, 15, 0.94);

            border:
                1px solid
                rgba(255, 255, 255, 0.15);

            border-radius: 9px;

            box-shadow:
                0 5px 25px
                rgba(0, 0, 0, 0.45);

            color: white;

            user-select: none;

        }


        #title {

            font-size: 19px;

            font-weight: bold;

        }


        #subtitle {

            margin-top: 4px;

            color: #999;

            font-size: 12px;

        }


        #info {

            margin-top: 12px;

            padding-top: 10px;

            border-top:
                1px solid
                rgba(255, 255, 255, 0.1);

            color: #aaa;

            font-family:
                Consolas,
                monospace;

            font-size: 11px;

            line-height: 1.65;

        }


        /* =====================================================
           STATUS
           ===================================================== */

        #status {

            position: absolute;

            left: 15px;
            bottom: 15px;

            z-index: 1000;

            padding: 8px 12px;

            background:
                rgba(15, 15, 15, 0.94);

            border:
                1px solid
                rgba(255, 255, 255, 0.12);

            border-radius: 6px;

            color: #aaa;

            font-family:
                Consolas,
                monospace;

            font-size: 11px;

            pointer-events: none;

        }


        /* =====================================================
           COORDONNÉES
           ===================================================== */

        #coordinates {

            position: absolute;

            right: 15px;
            bottom: 15px;

            z-index: 1000;

            padding: 8px 12px;

            background:
                rgba(15, 15, 15, 0.94);

            border:
                1px solid
                rgba(255, 255, 255, 0.12);

            border-radius: 6px;

            color: #aaa;

            font-family:
                Consolas,
                monospace;

            font-size: 11px;

            pointer-events: none;

        }


        /* =====================================================
           MAPLIBRE
           ===================================================== */

        .maplibregl-ctrl-attrib {

            background:
                rgba(0, 0, 0, 0.65) !important;

            color: #aaa;

        }


        .maplibregl-ctrl-attrib a {

            color: #ddd;

        }


        .maplibregl-ctrl-group {

            background:
                rgba(20, 20, 20, 0.9) !important;

        }


        .maplibregl-ctrl-group button {

            filter:
                invert(1);

        }

    </style>

</head>


<body>


    <!-- =========================================================
         CARTE
         ========================================================= -->

    <div id="map"></div>


    <!-- =========================================================
         INTERFACE
         ========================================================= -->

    <div id="panel">

        <div id="title">
            WPlace Bergamottto
        </div>

        <div id="subtitle">
            Carte tactique de La Commune et de ses alliés
        </div>

        <div id="info">

            Zoom :
            <span id="zoom">
                —
            </span>

            <br>

            Tuile WPlace :
            <span id="tile">
                —
            </span>

            <br>

            Pixels WPlace :
            <span id="pixels">
                —
            </span>

            <br>

            Tuiles chargées :
            <span id="tiles">
                0
            </span>

        </div>

    </div>


    <div id="status">
        Initialisation...
    </div>


    <div id="coordinates">
        X: — &nbsp; Y: —
    </div>


    <!-- =========================================================
         JAVASCRIPT
         ========================================================= -->

    <script>


        /*
         * =========================================================
         *
         * WPLACE BERGAMOTTTO
         *
         * =========================================================
         */


        /*
         * ---------------------------------------------------------
         * CONSTANTES WPLACE
         * ---------------------------------------------------------
         */


        const WPLACE_TILE_COUNT =
            2048;


        const WPLACE_TILE_SIZE =
            1000;


        const WPLACE_WORLD_SIZE =
            WPLACE_TILE_COUNT *
            WPLACE_TILE_SIZE;


        /*
         * ---------------------------------------------------------
         * COORDONNÉES INITIALES
         * ---------------------------------------------------------
         *
         * Toulon
         *
         */


        const INITIAL_LONGITUDE =
            5.93;


        const INITIAL_LATITUDE =
            43.12;


        const INITIAL_ZOOM =
            7;


        /*
         * ---------------------------------------------------------
         * CONVERSION LONGITUDE → PIXEL MONDIAL
         * ---------------------------------------------------------
         */


        function longitudeToWorldX(
            longitude
        ) {

            const x =
                (
                    longitude +
                    180
                ) / 360;


            return (
                x *
                (
                    WPLACE_WORLD_SIZE -
                    1
                )
            );

        }


        /*
         * ---------------------------------------------------------
         * CONVERSION LATITUDE → PIXEL MONDIAL
         * ---------------------------------------------------------
         */


        function latitudeToWorldY(
            latitude
        ) {

            const latRad =
                latitude *
                Math.PI /
                180;


            let y =
                0.5 -
                Math.log(
                    (
                        1 +
                        Math.sin(
                            latRad
                        )
                    ) /
                    (
                        1 -
                        Math.sin(
                            latRad
                        )
                    )
                ) /
                (
                    4 *
                    Math.PI
                );


            y =
                Math.min(
                    1,
                    Math.max(
                        0,
                        y
                    )
                );


            return (
                y *
                (
                    WPLACE_WORLD_SIZE -
                    1
                )
            );

        }


        /*
         * ---------------------------------------------------------
         * MONDE → TUILE WPLACE
         * ---------------------------------------------------------
         */


        function worldToWplaceTile(
            worldX,
            worldY
        ) {

            const tileX =
                Math.floor(
                    worldX /
                    WPLACE_TILE_SIZE
                );


            const tileY =
                Math.floor(
                    worldY /
                    WPLACE_TILE_SIZE
                );


            const pixelX =
                Math.floor(
                    worldX %
                    WPLACE_TILE_SIZE
                );


            const pixelY =
                Math.floor(
                    worldY %
                    WPLACE_TILE_SIZE
                );


            return {

                tileX,
                tileY,

                pixelX,
                pixelY

            };

        }


        /*
         * ---------------------------------------------------------
         * TEST DE CONVERSION
         * ---------------------------------------------------------
         */


        const testWorldX =
            longitudeToWorldX(
                INITIAL_LONGITUDE
            );


        const testWorldY =
            latitudeToWorldY(
                INITIAL_LATITUDE
            );


        const testTile =
            worldToWplaceTile(
                testWorldX,
                testWorldY
            );


        console.log(
            "========================================"
        );


        console.log(
            "WPlace Bergamottto"
        );


        console.log(
            "Monde WPlace :",
            WPLACE_WORLD_SIZE,
            "×",
            WPLACE_WORLD_SIZE
        );


        console.log(
            "Toulon pixel mondial :",
            testWorldX,
            testWorldY
        );


        console.log(
            "Toulon tuile WPlace :",
            testTile.tileX,
            testTile.tileY
        );


        console.log(
            "Toulon pixel dans la tuile :",
            testTile.pixelX,
            testTile.pixelY
        );


        console.log(
            "URL test :",
            "https://backend.wplace.live/files/s0/tiles/" +
            testTile.tileX +
            "/" +
            testTile.tileY +
            ".png"
        );


        console.log(
            "========================================"
        );


        /*
         * ---------------------------------------------------------
         * MAPLIBRE
         * ---------------------------------------------------------
         */


        const map =
            new maplibregl.Map({

                container:
                    "map",

                style:
                    "https://tiles.openfreemap.org/styles/liberty",

                center:
                    [
                        INITIAL_LONGITUDE,
                        INITIAL_LATITUDE
                    ],

                zoom:
                    INITIAL_ZOOM,

                minZoom:
                    0,

                maxZoom:
                    13,

                attributionControl:
                    true

            });


        /*
         * ---------------------------------------------------------
         * CONTRÔLES
         * ---------------------------------------------------------
         */


        map.addControl(
            new maplibregl.NavigationControl(),
            "top-right"
        );


        /*
         * ---------------------------------------------------------
         * SUIVI DES TUILES
         * ---------------------------------------------------------
         */


        const loadedTiles =
            new Set();


        let requestedTiles =
            new Set();


        /*
         * ---------------------------------------------------------
         * AJOUT D'UNE TUILE WPLACE
         * ---------------------------------------------------------
         *
         * Cette fonction crée une source image MapLibre
         * géoréférencée.
         *
         * Une tuile WPlace fait exactement :
         *
         * 1000 × 1000 pixels.
         *
         * ---------------------------------------------------------
         */


        function addWPlaceTile(
            tileX,
            tileY
        ) {


            const sourceId =
                "wplace-" +
                tileX +
                "-" +
                tileY;


            const layerId =
                sourceId +
                "-layer";


            /*
             * Éviter les doublons.
             */


            if (
                map.getSource(
                    sourceId
                )
            ) {

                return;

            }


            /*
             * Coordonnées mondiales
             */


            const westX =
                tileX *
                WPLACE_TILE_SIZE;


            const eastX =
                (
                    tileX +
                    1
                ) *
                WPLACE_TILE_SIZE;


            const northY =
                tileY *
                WPLACE_TILE_SIZE;


            const southY =
                (
                    tileY +
                    1
                ) *
                WPLACE_TILE_SIZE;


            /*
             * Conversion monde → longitude.
             */


            const west =
                (
                    westX /
                    (
                        WPLACE_WORLD_SIZE -
                        1
                    )
                ) *
                360 -
                180;


            const east =
                (
                    eastX /
                    (
                        WPLACE_WORLD_SIZE -
                        1
                    )
                ) *
                360 -
                180;


            /*
             * Conversion monde → latitude.
             */


            function worldYToLatitude(
                worldY
            ) {

                const normalized =
                    worldY /
                    (
                        WPLACE_WORLD_SIZE -
                        1
                    );


                const mercatorY =
                    0.5 -
                    normalized;


                const latitude =
                    Math.atan(
                        Math.sinh(
                            mercatorY *
                            2 *
                            Math.PI
                        )
                    ) *
                    180 /
                    Math.PI;


                return latitude;

            }


            const north =
                worldYToLatitude(
                    northY
                );


            const south =
                worldYToLatitude(
                    southY
                );


            /*
             * URL du PNG.
             */


            const imageUrl =
                "https://backend.wplace.live" +
                "/files/s0/tiles/" +
                tileX +
                "/" +
                tileY +
                ".png";


            /*
             * Source image.
             */


            map.addSource(
                sourceId,
                {

                    type:
                        "image",

                    url:
                        imageUrl,

                    coordinates:
                        [
                            [
                                west,
                                north
                            ],

                            [
                                east,
                                north
                            ],

                            [
                                east,
                                south
                            ],

                            [
                                west,
                                south
                            ]
                        ]

                }
            );


            /*
             * Couche.
             */


            map.addLayer({

                id:
                    layerId,

                type:
                    "raster",

                source:
                    sourceId,

                minzoom:
                    10,

                maxzoom:
                    13,

                paint:
                    {

                        "raster-opacity":
                            1,

                        "raster-fade-duration":
                            0

                    }

            });


            /*
             * Suivi du chargement.
             */


            requestedTiles.add(
                sourceId
            );


            loadedTiles.add(
                sourceId
            );


            updateTileCounter();

        }


        /*
         * ---------------------------------------------------------
         * CHARGER LES TUILES AUTOUR DU CENTRE
         * ---------------------------------------------------------
         *
         * Pour le premier test, on charge une zone 3×3 autour
         * de Toulon.
         *
         * Cela permet de vérifier immédiatement que les pixels
         * apparaissent sans demander des dizaines de tuiles.
         *
         * ---------------------------------------------------------
         */


        function loadInitialTiles() {


            const centerX =
                Math.floor(
                    longitudeToWorldX(
                        INITIAL_LONGITUDE
                    ) /
                    WPLACE_TILE_SIZE
                );


            const centerY =
                Math.floor(
                    latitudeToWorldY(
                        INITIAL_LATITUDE
                    ) /
                    WPLACE_TILE_SIZE
                );


            console.log(
                "Centre WPlace :",
                centerX,
                centerY
            );


            for (
                let x = centerX - 1;
                x <= centerX + 1;
                x++
            ) {


                for (
                    let y = centerY - 1;
                    y <= centerY + 1;
                    y++
                ) {


                    if (
                        x < 0 ||
                        x >= WPLACE_TILE_COUNT ||
                        y < 0 ||
                        y >= WPLACE_TILE_COUNT
                    ) {

                        continue;

                    }


                    addWPlaceTile(
                        x,
                        y
                    );

                }

            }


            document
                .getElementById(
                    "status"
                )
                .textContent =
                "Pixels WPlace chargés";


        }


        /*
         * ---------------------------------------------------------
         * COMPTEUR
         * ---------------------------------------------------------
         */


        function updateTileCounter() {


            document
                .getElementById(
                    "tiles"
                )
                .textContent =
                loadedTiles.size;


        }


        /*
         * ---------------------------------------------------------
         * INTERFACE
         * ---------------------------------------------------------
         */


        function updateInterface() {


            const zoom =
                map.getZoom();


            document
                .getElementById(
                    "zoom"
                )
                .textContent =
                zoom.toFixed(2);


            const center =
                map.getCenter();


            const worldX =
                longitudeToWorldX(
                    center.lng
                );


            const worldY =
                latitudeToWorldY(
                    center.lat
                );


            const tile =
                worldToWplaceTile(
                    worldX,
                    worldY
                );


            document
                .getElementById(
                    "tile"
                )
                .textContent =
                tile.tileX +
                " / " +
                tile.tileY;


            document
                .getElementById(
                    "pixels"
                )
                .textContent =
                tile.pixelX +
                " / " +
                tile.pixelY;

        }


        /*
         * ---------------------------------------------------------
         * SOURIS
         * ---------------------------------------------------------
         */


        map.on(
            "mousemove",
            function (
                event
            ) {


                const worldX =
                    longitudeToWorldX(
                        event.lngLat.lng
                    );


                const worldY =
                    latitudeToWorldY(
                        event.lngLat.lat
                    );


                const tile =
                    worldToWplaceTile(
                        worldX,
                        worldY
                    );


                document
                    .getElementById(
                        "coordinates"
                    )
                    .textContent =
                    "Tuile " +
                    tile.tileX +
                    " / " +
                    tile.tileY +
                    "   Pixel " +
                    tile.pixelX +
                    " / " +
                    tile.pixelY;


            }
        );


        /*
         * ---------------------------------------------------------
         * MOVE
         * ---------------------------------------------------------
         */


        map.on(
            "move",
            function () {

                updateInterface();

            }
        );


        map.on(
            "zoom",
            function () {

                updateInterface();


                const zoom =
                    map.getZoom();


                if (
                    zoom >= 10
                ) {

                    document
                        .getElementById(
                            "status"
                        )
                        .textContent =
                        "Pixels WPlace actifs";

                }
                else {

                    document
                        .getElementById(
                            "status"
                        )
                        .textContent =
                        "Fond géographique — zoom " +
                        zoom.toFixed(1);

                }

            }
        );


        /*
         * ---------------------------------------------------------
         * CHARGEMENT DE LA CARTE
         * ---------------------------------------------------------
         */


        map.on(
            "load",
            function () {


                console.log(
                    "Fond OpenFreeMap chargé"
                );


                /*
                 * Charger immédiatement les tuiles autour
                 * de Toulon.
                 */


                loadInitialTiles();


                updateInterface();


            }
        );


        /*
         * ---------------------------------------------------------
         * ERREURS MAPLIBRE
         * ---------------------------------------------------------
         */


        map.on(
            "error",
            function (
                event
            ) {

                console.error(
                    "MapLibre error :",
                    event
                );

            }
        );


    </script>


</body>

</html>
