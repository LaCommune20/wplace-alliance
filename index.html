<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quartier Général Tactique - Wplace</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; background: #0f111a; color: #fff; overflow: hidden; }
        
        /* 🗺️ GRILLE DE DÉPLACEMENT RADAR */
        #map-viewport { width: 100vw; height: 100vh; overflow: auto; position: relative; scroll-behavior: smooth; }
        
        /* GRILLE DE COORDONNÉES STYLE ÉTAT-MAJOR (0 script externe) */
        #grid { 
            position: relative; 
            width: 3000px; 
            height: 3000px; 
            background-color: #0b0c10;
            background-image: 
                linear-gradient(rgba(0, 255, 170, 0.05) 2px, transparent 2px),
                linear-gradient(90deg, rgba(0, 255, 170, 0.05) 2px, transparent 2px),
                linear-gradient(rgba(0, 255, 170, 0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 170, 0.15) 1px, transparent 1px);
            background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px;
        }

        /* AXES CENTRAUX (Repère 0,0) */
        #axis-x { position: absolute; top: 1500px; left: 0; width: 3000px; height: 2px; background: rgba(0, 255, 170, 0.4); pointer-events: none; }
        #axis-y { position: absolute; left: 1500px; top: 0; width: 2px; height: 3000px; background: rgba(0, 255, 170, 0.4); pointer-events: none; }
        
        /* PANNEAU FIXE DES CODES COULEUR */
        .tactical-panel { background: rgba(15, 17, 26, 0.95); padding: 15px; border-radius: 8px; border: 1px solid #1f2833; line-height: 24px; color: #fff; font-weight: bold; box-shadow: 0 4px 20px rgba(0,0,0,0.8); position: fixed; z-index: 1000; }
        .legend { bottom: 20px; right: 20px; width: 240px; border-left: 4px solid #00ffaa; }
        .legend h4 { margin: 0 0 8px 0; border-bottom: 1px solid #1f2833; padding-bottom: 4px; text-transform: uppercase; font-size: 12px; letter-spacing: 1px; color: #00ffaa; }
        .legend div { display: flex; align-items: center; margin-bottom: 4px; font-size: 12px; }
        .legend i { width: 14px; height: 14px; display: inline-block; margin-right: 10px; border-radius: 4px; border: 1px solid #fff; }
        
        /* GRAPHISME DES MARQUEURS ET DES ZONES DE SURVEILLANCE */
        .tactical-zone { position: absolute; border: 2px solid #fff; border-radius: 50%; transform: translate(-50%, -50%); cursor: pointer; box-shadow: 0 0 15px rgba(0,0,0,0.5); transition: transform 0.2s; }
        .pulse-anim { animation: pulse 1.5s infinite; }
        
        /* BULLE D'INFORMATION INTERACTIVE (AU SURVOL) */
        .marker-popup { 
            display: none; 
            position: absolute; 
            background: #1f2833; 
            color: #fff; 
            padding: 12px; 
            border-radius: 6px; 
            bottom: 125%; 
            left: 50%; 
            transform: translateX(-50%); 
            width: 200px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.6); 
            font-size: 11px; 
            font-weight: normal; 
            text-align: left; 
            line-height: 16px; 
            border: 1px solid #45f3ff; 
            z-index: 2000; 
            pointer-events: none; 
        }
        
        .tactical-zone:hover { z-index: 1500; transform: translate(-50%, -50%) scale(1.1); }
        .tactical-zone:hover .marker-popup { display: block !important; }
        
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,255,255,0.5); } 70% { box-shadow: 0 0 0 15px rgba(255,255,255,0); } 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); } }
    </style>
</head>
<body>

    <!-- Grille Tactique Dynamique -->
    <div id="map-viewport">
        <div id="grid">
            <div id="axis-x"></div>
            <div id="axis-y"></div>
            <!-- Les repères Supabase s'injectent ici -->
        </div>
    </div>

    <!-- Légende État-Major -->
    <div class="tactical-panel legend">
        <h4>Radar Tactique Wplace</h4>
        <div><i style="background: rgba(255, 0, 0, 0.4); border-color: #FF0000;"></i> 🛑 Alerte Bot / Raid Intel</div>
        <div><i style="background: rgba(0, 162, 255, 0.3); border-color: #00A2FF;"></i> 🔨 Construction En Cours</div>
        <div><i style="background: rgba(0, 255, 0, 0.3); border-color: #00FF00;"></i> ✅ Objectif Terminé (Done)</div>
        <div><i style="background: rgba(0, 255, 0, 0.8); border-color: #fff;"></i> 💡 Actu / Infos (Bulle)</div>
        <div><i style="background: rgba(238, 130, 238, 0.4); border-color: #EE82EE;"></i> ⚠️ Fausse Alerte</div>
        <div><i style="background: rgba(148, 0, 211, 0.4); border-color: #9400D3;"></i> ☣️ Infiltration (+2000px)</div>
    </div>

    <script>
        const grid = document.getElementById('grid');
        const viewport = document.getElementById('map-viewport');
        const SUPABASE_KEY = "sb_publishable_V_cQamZG0uZFy_xDwUkPUA_hf8q_1uL";

        // Centrer l'écran sur le point central (0,0) au lancement
        window.onload = () => {
            viewport.scrollLeft = 1000;
            viewport.scrollTop = 1000;
        };

        function getTacticalStyle(type, status) {
            if (status === 'fausse_alerte') return { color: '#EE82EE', fill: 'rgba(238, 130, 238, 0.3)', pulse: false };
            if (status === 'infiltration') return { color: '#9400D3', fill: 'rgba(148, 0, 211, 0.4)', pulse: true };
            if (type === 'done') return { color: '#00FF00', fill: 'rgba(0, 255, 0, 0.2)', pulse: false };
            
            if (type === 'grief') return { color: '#FF0000', fill: 'rgba(255, 0, 0, 0.4)', pulse: true };
            if (type === 'build') return { color: '#00A2FF', fill: 'rgba(0, 162, 255, 0.2)', pulse: true };
            return { color: '#ffffff', fill: 'rgba(0, 255, 0, 0.7)', pulse: false };
        }

        function createVisualZone(event) {
            if(document.getElementById(`zone-${event.id}`)) return;

            const zone = document.createElement('div');
            zone.className = 'tactical-zone';
            zone.id = `zone-${event.id}`;
            
            const style = getTacticalStyle(event.type, event.status);
            if(style.pulse) zone.classList.add('pulse-anim');

            // Rayon ou taille par défaut (24px)
            const diameter = event.radius && event.radius > 0 ? (event.radius * 2) : 24;
            zone.style.width = `${diameter}px`;
            zone.style.height = `${diameter}px`;
            zone.style.borderColor = style.color;
            zone.style.backgroundColor = style.fill;

            // Placement sur notre repère radar de 3000x3000px (0,0 se situe à 1500,1500)
            const centerX = 1500;
            const centerY = 1500;
            const posX = centerX + event.x; 
            const posY = centerY - event.y; 

            zone.style.left = `${posX}px`;
            zone.style.top = `${posY}px`;

            const popup = document.createElement('div');
            popup.className = 'marker-popup';
            popup.innerHTML = `
                <b style="color:${style.color}; text-transform:uppercase;">[${event.status ? event.status.toUpperCase() : event.type.toUpperCase()}] #${event.id}</b><br>
                <b>Coordonnées :</b> X: ${event.x} | Y: ${event.y}<br>
                <b>Officier :</b> ${event.author || 'Radar Auto'}<br>
                <hr style="border:0; border-top:1px solid #444; margin:6px 0;">
                <span style="font-style:italic;">"${event.description}"</span>
            `;
            
            zone.appendChild(popup);
            grid.appendChild(zone);
        }

        async function fetchTacticalIntel() {
            try {
                const response = await fetch("https://supabase.co" + Date.now(), {
                    method: 'GET',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });
                
                if (!response.ok) throw new Error('Erreur réseau');
                const data = await response.json();
                
                const activeIds = data.map(e => `zone-${e.id}`);
                const currentZones = document.querySelectorAll('.tactical-zone');
                currentMarkers = currentZones.forEach(z => {
                    if(!activeIds.includes(z.id)) z.remove();
                });

                data.forEach(event => createVisualZone(event));
            } catch (err) {
                console.error("Erreur Synchro Radar :", err);
            }
        }

        fetchTacticalIntel();
        setInterval(fetchTacticalIntel, 3000);
    </script>
</body>
</html>
