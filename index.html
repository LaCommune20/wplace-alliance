<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>WPlace - La Commune</title>


    <!-- =========================================================
         MAPLIBRE
         ========================================================= -->

    <link
        href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css"
        rel="stylesheet"
    >

    <script
        src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js">
    </script>


    <!-- =========================================================
         STYLE
         ========================================================= -->

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #111;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

        }

        #map {

            width: 100%;
            height: 100%;

        }


        /* =====================================================
           PANNEAU
           ===================================================== */

        #panel {

            position: absolute;

            top: 15px;
            left: 15px;

            z-index: 1000;

            min-width: 285px;

            padding: 14px 17px;

            background:
                rgba(15, 15, 15, 0.94);

            border:
                1px solid
                rgba(255, 255, 255, 0.15);

            border-radius: 9px;

            box-shadow:
                0 5px 25px
                rgba(0, 0, 0, 0.45);

            color: white;

            user-select: none;

        }


        #title {

            font-size: 19px;

            font-weight: bold;

        }


        #subtitle {

            margin-top: 4px;

            color: #999;

            font-size: 12px;

        }


        #info {

            margin-top: 12px;

            padding-top: 10px;

            border-top:
                1px solid
                rgba(255, 255, 255, 0.1);

            color: #aaa;

            font-family:
                Consolas,
                monospace;

            font-size: 11px;

            line-height: 1.65;

        }


        /* =====================================================
           STATUS
           ===================================================== */

        #status {

            position: absolute;

            left: 15px;
            bottom: 15px;

            z-index: 1000;

            padding: 8px 12px;

            background:
                rgba(15, 15, 15, 0.94);

            border:
                1px solid
                rgba(255, 255, 255, 0.12);

            border-radius: 6px;

            color: #aaa;

            font-family:
                Consolas,
                monospace;

            font-size: 11px;

            pointer-events: none;

        }


        /* =====================================================
           COORDONNÉES
           ===================================================== */

        #coordinates {

            position: absolute;

            right: 15px;
            bottom: 15px;

            z-index: 1000;

            padding: 8px 12px;

            background:
                rgba(15, 15, 15, 0.94);

            border:
                1px solid
                rgba(255, 255, 255, 0.12);

            border-radius: 6px;

            color: #aaa;

            font-family:
                Consolas,
                monospace;

            font-size: 11px;

            pointer-events: none;

        }


        /* =====================================================
           MAPLIBRE
           ===================================================== */

        .maplibregl-ctrl-attrib {

            background:
                rgba(0, 0, 0, 0.65) !important;

            color: #aaa;

        }

        .maplibregl-ctrl-attrib a {

            color: #ddd;

        }

        .maplibregl-ctrl-group {

            background:
                rgba(20, 20, 20, 0.9) !important;

        }

        .maplibregl-ctrl-group button {

            filter:
                invert(1);

        }

    </style>

</head>


<body>


    <!-- =========================================================
         CARTE
         ========================================================= -->

    <div id="map"></div>


    <!-- =========================================================
         INTERFACE
         ========================================================= -->

    <div id="panel">

        <div id="title">
            WPlace Bergamottto
        </div>

        <div id="subtitle">
            Carte tactique de La Commune et de ses alliés
        </div>

        <div id="info">

            Zoom :
            <span id="zoom">
                —
            </span>

            <br>

            Tuile WPlace :
            <span id="tile">
                —
            </span>

            <br>

            Pixel dans la tuile :
            <span id="pixel">
                —
            </span>

            <br>

            Tuiles WPlace :
            <span id="tiles">
                0
            </span>

        </div>

    </div>


    <div id="status">
        Initialisation de la carte...
    </div>


    <div id="coordinates">
        X: — &nbsp; Y: —
    </div>


    <!-- =========================================================
         JAVASCRIPT
         ========================================================= -->

    <script>


        /*
         * =========================================================
         *
         * WPLACE BERGAMOTTTO
         *
         * Carte tactique de La Commune et de ses alliés
         *
         * =========================================================
         */


        /*
         * =========================================================
         * CONSTANTES WPLACE
         * =========================================================
         */


        const WPLACE_TILE_COUNT = 2048;

        const WPLACE_TILE_SIZE = 1000;

        const WPLACE_ZOOM = 11;

        const WPLACE_WORLD_SIZE =
            WPLACE_TILE_COUNT *
            WPLACE_TILE_SIZE;


        /*
         * =========================================================
         * POSITION INITIALE
         * =========================================================
         *
         * On démarre autour de Toulon.
         *
         */


        const INITIAL_LONGITUDE = 5.93;

        const INITIAL_LATITUDE = 43.12;

        const INITIAL_ZOOM = 7;


        /*
         * =========================================================
         * CONVERSION LONGITUDE → MONDE WPLACE
         * =========================================================
         *
         * WPlace possède 2048 tuiles sur 360 degrés.
         *
         * Chaque tuile possède 1000 pixels.
         *
         */


        function longitudeToWorldX(longitude) {

            return (
                (longitude + 180) /
                360 *
                WPLACE_WORLD_SIZE
            );

        }


        /*
         * =========================================================
         * CONVERSION LATITUDE → MONDE WPLACE
         * =========================================================
         *
         * Projection Web Mercator.
         *
         */


        function latitudeToWorldY(latitude) {

            const latitudeRadians =
                latitude *
                Math.PI /
                180;


            const mercator =
                Math.log(
                    Math.tan(
                        Math.PI / 4 +
                        latitudeRadians / 2
                    )
                );


            return (
                (
                    1 -
                    mercator / Math.PI
                ) /
                2
            ) *
            WPLACE_WORLD_SIZE;

        }


        /*
         * =========================================================
         * MONDE WPLACE → COORDONNÉES WPLACE
         * =========================================================
         */


        function worldToWplace(
            worldX,
            worldY
        ) {

            let tileX =
                Math.floor(
                    worldX /
                    WPLACE_TILE_SIZE
                );


            let tileY =
                Math.floor(
                    worldY /
                    WPLACE_TILE_SIZE
                );


            let pixelX =
                Math.floor(
                    worldX -
                    tileX *
                    WPLACE_TILE_SIZE
                );


            let pixelY =
                Math.floor(
                    worldY -
                    tileY *
                    WPLACE_TILE_SIZE
                );


            /*
             * Sécurité.
             */

            tileX =
                Math.max(
                    0,
                    Math.min(
                        WPLACE_TILE_COUNT - 1,
                        tileX
                    )
                );


            tileY =
                Math.max(
                    0,
                    Math.min(
                        WPLACE_TILE_COUNT - 1,
                        tileY
                    )
                );


            return {

                tileX,
                tileY,

                pixelX,
                pixelY

            };

        }


        /*
         * =========================================================
         * COORDONNÉE MONDE → LONGITUDE
         * =========================================================
         */


        function worldXToLongitude(
            worldX
        ) {

            return (
                worldX /
                WPLACE_WORLD_SIZE *
                360
            ) - 180;

        }


        /*
         * =========================================================
         * COORDONNÉE MONDE → LATITUDE
         * =========================================================
         */


        function worldYToLatitude(
            worldY
        ) {

            const normalized =
                worldY /
                WPLACE_WORLD_SIZE;


            const mercatorY =
                Math.PI *
                (
                    1 -
                    2 *
                    normalized
                );


            return (
                Math.atan(
                    Math.sinh(
                        mercatorY
                    )
                ) *
                180 /
                Math.PI
            );

        }


        /*
         * =========================================================
         * CALCUL DE LA TUILE INITIALE
         * =========================================================
         */


        const initialWorldX =
            longitudeToWorldX(
                INITIAL_LONGITUDE
            );


        const initialWorldY =
            latitudeToWorldY(
                INITIAL_LATITUDE
            );


        const initialTile =
            worldToWplace(
                initialWorldX,
                initialWorldY
            );


        console.log(
            "========================================"
        );

        console.log(
            "WPlace Bergamottto"
        );

        console.log(
            "Monde :",
            WPLACE_WORLD_SIZE,
            "×",
            WPLACE_WORLD_SIZE
        );

        console.log(
            "Zoom natif :",
            WPLACE_ZOOM
        );

        console.log(
            "Toulon → tuile :",
            initialTile.tileX,
            initialTile.tileY
        );

        console.log(
            "Toulon → pixel :",
            initialTile.pixelX,
            initialTile.pixelY
        );

        console.log(
            "URL WPlace :",
            "https://backend.wplace.live/files/s0/tiles/" +
            initialTile.tileX +
            "/" +
            initialTile.tileY +
            ".png"
        );

        console.log(
            "========================================"
        );


        /*
         * =========================================================
         * MAPLIBRE
         * =========================================================
         */


        const map =
            new maplibregl.Map({

                container:
                    "map",

                style:
                    "https://tiles.openfreemap.org/styles/liberty",

                center:
                    [
                        INITIAL_LONGITUDE,
                        INITIAL_LATITUDE
                    ],

                zoom:
                    INITIAL_ZOOM,

                minZoom:
                    0,

                maxZoom:
                    13,

                attributionControl:
                    true

            });


        /*
         * =========================================================
         * CONTRÔLES
         * =========================================================
         */


        map.addControl(
            new maplibregl.NavigationControl(),
            "top-right"
        );


        /*
         * =========================================================
         * TUILES WPLACE CHARGÉES
         * =========================================================
         */


        const loadedTiles =
            new Set();


        /*
         * =========================================================
         * CRÉATION DES COORDONNÉES D'UNE TUILE
         * =========================================================
         */


        function getTileCoordinates(
            tileX,
            tileY
        ) {


            const worldWest =
                tileX *
                WPLACE_TILE_SIZE;


            const worldEast =
                (
                    tileX + 1
                ) *
                WPLACE_TILE_SIZE;


            const worldNorth =
                tileY *
                WPLACE_TILE_SIZE;


            const worldSouth =
                (
                    tileY + 1
                ) *
                WPLACE_TILE_SIZE;


            const west =
                worldXToLongitude(
                    worldWest
                );


            const east =
                worldXToLongitude(
                    worldEast
                );


            const north =
                worldYToLatitude(
                    worldNorth
                );


            const south =
                worldYToLatitude(
                    worldSouth
                );


            return [

                [
                    west,
                    north
                ],

                [
                    east,
                    north
                ],

                [
                    east,
                    south
                ],

                [
                    west,
                    south
                ]

            ];

        }


        /*
         * =========================================================
         * AJOUT D'UNE TUILE WPLACE
         * =========================================================
         */


        function addWPlaceTile(
            tileX,
            tileY
        ) {


            const id =
                "wplace-" +
                tileX +
                "-" +
                tileY;


            /*
             * Empêcher les doublons.
             */


            if (
                map.getSource(id)
            ) {

                return;

            }


            /*
             * URL officielle des tuiles.
             */


            const url =
                "https://backend.wplace.live" +
                "/files/s0/tiles/" +
                tileX +
                "/" +
                tileY +
                ".png";


            /*
             * Coordonnées géographiques
             * des quatre coins.
             */


            const coordinates =
                getTileCoordinates(
                    tileX,
                    tileY
                );


            console.log(
                "Ajout tuile WPlace :",
                tileX,
                tileY
            );


            /*
             * Source IMAGE MapLibre.
             *
             * Une source image permet de placer directement
             * un PNG aux coordonnées géographiques voulues.
             *
             */


            map.addSource(
                id,
                {

                    type:
                        "image",

                    url:
                        url,

                    coordinates:
                        coordinates

                }
            );


            /*
             * Couche raster.
             */


            map.addLayer({

                id:
                    id +
                    "-layer",

                type:
                    "raster",

                source:
                    id,

                minzoom:
                    9,

                maxzoom:
                    13,

                paint:
                    {

                        "raster-opacity":
                            1,

                        "raster-fade-duration":
                            0

                    }

            });


            loadedTiles.add(
                id
            );


            updateTileCounter();


        }


        /*
         * =========================================================
         * CHARGEMENT DU PREMIER TEST
         * =========================================================
         *
         * On ne charge volontairement qu'une seule tuile.
         *
         * Cela permet de vérifier :
         *
         * 1. URL
         * 2. PNG
         * 3. CORS
         * 4. projection
         * 5. positionnement
         *
         */


        function loadTestTile() {


            const tileX =
                initialTile.tileX;


            const tileY =
                initialTile.tileY;


            console.log(
                "Tuile de test :",
                tileX,
                tileY
            );


            addWPlaceTile(
                tileX,
                tileY
            );


            document
                .getElementById(
                    "status"
                )
                .textContent =
                "Tuile WPlace de test chargée";


        }


        /*
         * =========================================================
         * COMPTEUR
         * =========================================================
         */


        function updateTileCounter() {


            document
                .getElementById(
                    "tiles"
                )
                .textContent =
                loadedTiles.size;

        }


        /*
         * =========================================================
         * INTERFACE
         * =========================================================
         */


        function updateInterface() {


            const zoom =
                map.getZoom();


            document
                .getElementById(
                    "zoom"
                )
                .textContent =
                zoom.toFixed(2);


            const center =
                map.getCenter();


            const worldX =
                longitudeToWorldX(
                    center.lng
                );


            const worldY =
                latitudeToWorldY(
                    center.lat
                );


            const wplace =
                worldToWplace(
                    worldX,
                    worldY
                );


            document
                .getElementById(
                    "tile"
                )
                .textContent =
                wplace.tileX +
                " / " +
                wplace.tileY;


            document
                .getElementById(
                    "pixel"
                )
                .textContent =
                wplace.pixelX +
                " / " +
                wplace.pixelY;

        }


        /*
         * =========================================================
         * POSITION DE LA SOURIS
         * =========================================================
         */


        map.on(
            "mousemove",
            function (
                event
            ) {


                const worldX =
                    longitudeToWorldX(
                        event.lngLat.lng
                    );


                const worldY =
                    latitudeToWorldY(
                        event.lngLat.lat
                    );


                const wplace =
                    worldToWplace(
                        worldX,
                        worldY
                    );


                document
                    .getElementById(
                        "coordinates"
                    )
                    .textContent =
                    "Tuile " +
                    wplace.tileX +
                    " / " +
                    wplace.tileY +
                    "   Pixel " +
                    wplace.pixelX +
                    " / " +
                    wplace.pixelY;


            }
        );


        /*
         * =========================================================
         * DÉPLACEMENT
         * =========================================================
         */


        map.on(
            "move",
            function () {

                updateInterface();

            }
        );


        /*
         * =========================================================
         * ZOOM
         * =========================================================
         */


        map.on(
            "zoom",
            function () {

                updateInterface();


                const zoom =
                    map.getZoom();


                if (
                    zoom >= 9
                ) {

                    document
                        .getElementById(
                            "status"
                        )
                        .textContent =
                        "Pixels WPlace actifs — zoom " +
                        zoom.toFixed(1);

                }
                else {

                    document
                        .getElementById(
                            "status"
                        )
                        .textContent =
                        "Carte WPlace — zoom " +
                        zoom.toFixed(1);

                }

            }
        );


        /*
         * =========================================================
         * CARTE PRÊTE
         * =========================================================
         */


        map.on(
            "load",
            function () {


                console.log(
                    "Carte géographique chargée"
                );


                updateInterface();


                /*
                 * Chargement de la tuile WPlace.
                 */


                loadTestTile();


            }
        );


        /*
         * =========================================================
         * ERREURS
         * =========================================================
         */


        map.on(
            "error",
            function (
                event
            ) {

                console.error(
                    "Erreur MapLibre :",
                    event
                );

            }
        );


    </script>


</body>

</html>
