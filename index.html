<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>WPlace Alliance</title>


    <!-- ========================================================= -->
    <!-- LEAFLET                                                   -->
    <!-- ========================================================= -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        crossorigin=""
    >


    <!-- ========================================================= -->
    <!-- STYLE                                                     -->
    <!-- ========================================================= -->

    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #111;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

        }


        #map {

            width: 100%;
            height: 100%;

            background: #202020;

        }


        /* ===================================================== */
        /* BARRE SUPÉRIEURE                                      */
        /* ===================================================== */

        #topbar {

            position: absolute;

            top: 15px;
            left: 15px;

            z-index: 1000;

            padding: 12px 18px;

            background:
                rgba(15, 15, 15, 0.92);

            border:
                1px solid
                rgba(255, 255, 255, 0.15);

            border-radius: 8px;

            box-shadow:
                0 4px 20px
                rgba(0, 0, 0, 0.45);

            color: white;

            user-select: none;

        }


        #title {

            font-size: 19px;

            font-weight: bold;

        }


        #subtitle {

            margin-top: 4px;

            color: #999;

            font-size: 12px;

        }


        /* ===================================================== */
        /* STATUS                                                  */
        /* ===================================================== */

        #status {

            position: absolute;

            left: 15px;
            bottom: 15px;

            z-index: 1000;

            padding: 8px 12px;

            background:
                rgba(15, 15, 15, 0.92);

            border:
                1px solid
                rgba(255, 255, 255, 0.12);

            border-radius: 6px;

            color: #aaa;

            font-size: 12px;

            pointer-events: none;

        }


        /* ===================================================== */
        /* COORDONNÉES                                             */
        /* ===================================================== */

        #coordinates {

            position: absolute;

            right: 15px;
            bottom: 15px;

            z-index: 1000;

            padding: 8px 12px;

            background:
                rgba(15, 15, 15, 0.92);

            border:
                1px solid
                rgba(255, 255, 255, 0.12);

            border-radius: 6px;

            color: #aaa;

            font-size: 12px;

            pointer-events: none;

        }


        /* ===================================================== */
        /* TUILES                                                  */
        /* ===================================================== */

        .wplace-tile {

            display: block;

            background: #222;

            border: none;

            image-rendering: auto;

        }


        /* ===================================================== */
        /* LEAFLET                                                  */
        /* ===================================================== */

        .leaflet-control-attribution {

            background:
                rgba(0, 0, 0, 0.7) !important;

            color: #aaa;

        }


        .leaflet-control-attribution a {

            color: #ddd;

        }

    </style>

</head>


<body>


    <!-- ========================================================= -->
    <!-- CARTE                                                     -->
    <!-- ========================================================= -->

    <div id="map"></div>


    <!-- ========================================================= -->
    <!-- INTERFACE                                                 -->
    <!-- ========================================================= -->

    <div id="topbar">

        <div id="title">
            WPlace Alliance
        </div>

        <div id="subtitle">
            Carte tactique de l'alliance
        </div>

    </div>


    <div id="status">
        Initialisation de la carte...
    </div>


    <div id="coordinates">
        X: — &nbsp;&nbsp; Y: —
    </div>


    <!-- ========================================================= -->
    <!-- LEAFLET                                                   -->
    <!-- ========================================================= -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        crossorigin="">
    </script>


    <!-- ========================================================= -->
    <!-- WPLACE ALLIANCE                                           -->
    <!-- ========================================================= -->

    <script>

        /*
         * =========================================================
         *
         * WPLACE ALLIANCE
         *
         * Carte WPlace
         *
         * =========================================================
         */


        /*
         * ---------------------------------------------------------
         * CONSTANTES WPLACE
         * ---------------------------------------------------------
         *
         * Une tuile WPlace :
         *
         * 1000 × 1000 pixels
         *
         * La carte possède :
         *
         * 2048 × 2048 tuiles
         *
         */


        const WPLACE_TILE_SIZE = 1000;

        const WPLACE_TILE_COUNT = 2048;


        /*
         * ---------------------------------------------------------
         * NIVEAU NATIF
         * ---------------------------------------------------------
         *
         * 2^11 = 2048
         *
         * Donc le niveau 11 correspond à la grille native.
         */


        const WPLACE_NATIVE_ZOOM = 11;


        /*
         * ---------------------------------------------------------
         * WORLD SIZE
         * ---------------------------------------------------------
         *
         * 2048 × 1000
         *
         */


        const WPLACE_WORLD_SIZE =
            WPLACE_TILE_SIZE *
            WPLACE_TILE_COUNT;


        /*
         * ---------------------------------------------------------
         * ÉLÉMENTS INTERFACE
         * ---------------------------------------------------------
         */


        const statusElement =
            document.getElementById(
                "status"
            );


        const coordinatesElement =
            document.getElementById(
                "coordinates"
            );


        /*
         * ---------------------------------------------------------
         * CARTE
         * ---------------------------------------------------------
         *
         * CRS.Simple est utilisé avec une grille exprimée
         * directement en pixels.
         *
         */


        const map =
            L.map(
                "map",
                {

                    crs: L.CRS.Simple,

                    minZoom: 0,

                    maxZoom: WPLACE_NATIVE_ZOOM,

                    zoomControl: true,

                    attributionControl: true,

                    worldCopyJump: false

                }
            );


        /*
         * ---------------------------------------------------------
         * COUCHE WPLACE
         * ---------------------------------------------------------
         *
         * GridLayer permet de contrôler directement :
         *
         * x
         * y
         * zoom
         *
         */


        const WPlaceGrid =
            L.GridLayer.extend({

                tileSize:
                    WPLACE_TILE_SIZE,


                minZoom: 0,

                maxZoom:
                    WPLACE_NATIVE_ZOOM,


                noWrap: true,


                keepBuffer: 1,


                updateWhenIdle: true,


                updateWhenZooming: false,


                createTile:
                    function (
                        coords,
                        done
                    ) {


                        /*
                         * -----------------------------------------
                         * Création de l'image
                         * -----------------------------------------
                         */


                        const tile =
                            document.createElement(
                                "img"
                            );


                        tile.className =
                            "wplace-tile";


                        tile.width =
                            WPLACE_TILE_SIZE;


                        tile.height =
                            WPLACE_TILE_SIZE;


                        tile.alt = "";


                        /*
                         * -----------------------------------------
                         * Calcul du zoom WPlace
                         * -----------------------------------------
                         *
                         * Leaflet peut demander plusieurs niveaux.
                         *
                         * Notre niveau natif est 11.
                         *
                         */


                        const zoom =
                            coords.z;


                        /*
                         * -----------------------------------------
                         * Conversion des coordonnées
                         * -----------------------------------------
                         *
                         * À zoom 11 :
                         *
                         * 2048 × 2048
                         *
                         *
                         * À un zoom inférieur :
                         *
                         * les coordonnées représentent des
                         * groupes de tuiles.
                         *
                         */


                        let x =
                            coords.x;

                        let y =
                            coords.y;


                        /*
                         * -----------------------------------------
                         * Limites
                         * -----------------------------------------
                         */


                        const tilesAtZoom =
                            Math.pow(
                                2,
                                zoom
                            );


                        if (
                            x < 0 ||
                            y < 0 ||
                            x >= tilesAtZoom ||
                            y >= tilesAtZoom
                        ) {

                            tile.style.visibility =
                                "hidden";


                            setTimeout(
                                function () {

                                    done(
                                        null,
                                        tile
                                    );

                                },
                                0
                            );


                            return tile;

                        }


                        /*
                         * -----------------------------------------
                         * Conversion vers la grille native
                         * -----------------------------------------
                         *
                         * Exemple :
                         *
                         * zoom 11 :
                         *
                         * 1 → 1
                         *
                         * zoom 10 :
                         *
                         * 1 → 2
                         *
                         * zoom 9 :
                         *
                         * 1 → 4
                         *
                         */


                        const factor =
                            Math.pow(
                                2,
                                WPLACE_NATIVE_ZOOM -
                                zoom
                            );


                        /*
                         * Tuile native correspondante.
                         */


                        const nativeX =
                            x * factor;


                        const nativeY =
                            y * factor;


                        /*
                         * -----------------------------------------
                         * Pour les niveaux inférieurs au niveau
                         * natif, on doit pouvoir représenter
                         * plusieurs tuiles WPlace dans une même
                         * tuile Leaflet.
                         *
                         * Pour l'instant on charge la première.
                         *
                         * Les niveaux de zoom intermédiaires seront
                         * améliorés ensuite avec une vraie couche
                         * de mosaïque.
                         * -----------------------------------------
                         */


                        const finalX =
                            Math.floor(
                                nativeX
                            );


                        const finalY =
                            Math.floor(
                                nativeY
                            );


                        /*
                         * -----------------------------------------
                         * URL WPlace
                         * -----------------------------------------
                         */


                        const url =
                            "https://backend.wplace.live" +
                            "/files/s0/tiles/" +
                            finalX +
                            "/" +
                            finalY +
                            ".png";


                        /*
                         * -----------------------------------------
                         * Chargement
                         * -----------------------------------------
                         */


                        tile.onload =
                            function () {

                                done(
                                    null,
                                    tile
                                );

                                updateStatus();

                            };


                        /*
                         * -----------------------------------------
                         * Erreur
                         * -----------------------------------------
                         */


                        tile.onerror =
                            function () {

                                console.warn(
                                    "Tuile WPlace indisponible :",
                                    finalX,
                                    finalY
                                );


                                tile.style.background =
                                    "#222";


                                done(
                                    null,
                                    tile
                                );

                            };


                        /*
                         * -----------------------------------------
                         * URL
                         * -----------------------------------------
                         */


                        tile.src =
                            url;


                        return tile;

                    }

            });


        /*
         * ---------------------------------------------------------
         * AJOUT DE LA COUCHE
         * ---------------------------------------------------------
         */


        const wplaceLayer =
            new WPlaceGrid();


        wplaceLayer.addTo(
            map
        );


        /*
         * ---------------------------------------------------------
         * MONDE
         * ---------------------------------------------------------
         */


        const worldBounds =
            L.latLngBounds(
                [
                    0,
                    0
                ],
                [
                    WPLACE_WORLD_SIZE,
                    WPLACE_WORLD_SIZE
                ]
            );


        map.setMaxBounds(
            worldBounds
        );


        /*
         * ---------------------------------------------------------
         * VUE INITIALE
         * ---------------------------------------------------------
         *
         * On démarre volontairement à un zoom raisonnable.
         *
         * Pas de chargement de milliers de tuiles.
         *
         */


        map.fitBounds(
            worldBounds
        );


        /*
         * ---------------------------------------------------------
         * STATUS
         * ---------------------------------------------------------
         */


        function updateStatus() {

            const zoom =
                map.getZoom();


            statusElement.textContent =
                "Carte WPlace active • Zoom " +
                zoom.toFixed(1);

        }


        /*
         * ---------------------------------------------------------
         * DÉPLACEMENT
         * ---------------------------------------------------------
         */


        map.on(
            "move",
            function () {

                updateStatus();

            }
        );


        map.on(
            "zoom",
            function () {

                updateStatus();

            }
        );


        /*
         * ---------------------------------------------------------
         * COORDONNÉES
         * ---------------------------------------------------------
         */


        map.on(
            "mousemove",
            function (event) {


                const x =
                    Math.floor(
                        event.latlng.lng
                    );


                const y =
                    Math.floor(
                        event.latlng.lat
                    );


                coordinatesElement.textContent =
                    "X: " +
                    x +
                    "   Y: " +
                    y;

            }
        );


        /*
         * ---------------------------------------------------------
         * INITIALISATION
         * ---------------------------------------------------------
         */


        console.log(
            "================================="
        );


        console.log(
            "WPlace Alliance"
        );


        console.log(
            "Carte initialisée"
        );


        console.log(
            "Taille d'une tuile :",
            WPLACE_TILE_SIZE
        );


        console.log(
            "Nombre de tuiles :",
            WPLACE_TILE_COUNT
        );


        console.log(
            "Zoom natif :",
            WPLACE_NATIVE_ZOOM
        );


        console.log(
            "Taille du monde :",
            WPLACE_WORLD_SIZE
        );


        console.log(
            "================================="
        );


        updateStatus();

    </script>


</body>

</html>
