<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quartier Général Tactique - Wplace</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; background: #121212; color: #fff; overflow: hidden; }
        
        /* 🗺️ ZONE DE DÉPLACEMENT DE LA CARTE */
        #map-viewport { width: 100vw; height: 100vh; overflow: auto; position: relative; }
        
        /* FOND DE CARTE OFFICIEL DE WPLACE EN IMAGE DIRECTE */
        #grid { 
            position: relative; 
            width: 2000px; 
            height: 2000px; 
            background-color: #1a1a1a;
            background-image: url('https://wplace.live');
            background-size: 2000px 2000px;
            background-repeat: no-repeat;
        }
        
        /* PANNEAU DE FIXE DES CODES COULEUR */
        .tactical-panel { background: rgba(20, 20, 20, 0.95); padding: 15px; border-radius: 8px; border: 1px solid #444; line-height: 24px; color: #fff; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.6); position: fixed; z-index: 1000; }
        .legend { bottom: 20px; right: 20px; width: 240px; }
        .legend h4 { margin: 0 0 8px 0; border-bottom: 1px solid #555; padding-bottom: 4px; text-transform: uppercase; font-size: 12px; letter-spacing: 1px; color: #FFD700; }
        .legend div { display: flex; align-items: center; margin-bottom: 4px; font-size: 12px; }
        .legend i { width: 14px; height: 14px; display: inline-block; margin-right: 10px; border-radius: 4px; border: 1px solid #fff; }
        
        /* GRAPHISME DES MARQUEURS ET DES ZONES DE SURVEILLANCE */
        .tactical-zone { position: absolute; border: 2px solid #fff; border-radius: 50%; transform: translate(-50%, -50%); cursor: pointer; box-shadow: 0 0 10px rgba(0,0,0,0.8); }
        .pulse-anim { animation: pulse 1.5s infinite; }
        
        /* BULLE D'INFORMATION INTERACTIVE (CACHÉE PAR DÉFAUT) */
        .marker-popup { 
            display: none; 
            position: absolute; 
            background: #1c1c1c; 
            color: #fff; 
            padding: 10px; 
            border-radius: 6px; 
            bottom: 120%; 
            left: 50%; 
            transform: translateX(-50%); 
            width: 180px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
            font-size: 11px; 
            font-weight: normal; 
            text-align: left; 
            line-height: 16px; 
            border: 1px solid #444; 
            z-index: 2000; 
            pointer-events: none; 
        }
        
        /* APPARITION NETTE AU SURVOL */
        .tactical-zone:hover { z-index: 1500; }
        .tactical-zone:hover .marker-popup { display: block !important; }
        
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,255,255,0.6); } 70% { box-shadow: 0 0 0 10px rgba(255,255,255,0); } 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); } }
    </style>
</head>
<body>

    <!-- Fenêtre d'exploration de la carte -->
    <div id="map-viewport">
        <div id="grid">
            <!-- Les repères Supabase s'injectent ici -->
        </div>
    </div>

    <!-- Légende Équipe fixes à l'écran -->
    <div class="tactical-panel legend">
        <h4>Codes Couleur État-Major</h4>
        <div><i style="background: rgba(255, 0, 0, 0.4); border-color: #FF0000;"></i> 🛑 Alerte Bot / Raid Intel</div>
        <div><i style="background: rgba(0, 162, 255, 0.3); border-color: #00A2FF;"></i> 🔨 Construction En Cours</div>
        <div><i style="background: rgba(0, 255, 0, 0.3); border-color: #00FF00;"></i> ✅ Objectif Terminé (Done)</div>
        <div><i style="background: rgba(0, 255, 0, 0.8); border-color: #fff;"></i> 💡 Actu / Infos (Bulle)</div>
        <div><i style="background: rgba(238, 130, 238, 0.4); border-color: #EE82EE;"></i> ⚠️ Fausse Alerte</div>
        <div><i style="background: rgba(148, 0, 211, 0.4); border-color: #9400D3;"></i> ☣️ Infiltration (+2000px)</div>
    </div>

    <script>
        const grid = document.getElementById('grid');
        const viewport = document.getElementById('map-viewport');
        const SUPABASE_KEY = "sb_publishable_V_cQamZG0uZFy_xDwUkPUA_hf8q_1uL";

        // Centrer automatiquement l'explorateur au milieu du canevas Wplace au chargement
        window.onload = () => {
            viewport.scrollLeft = 500;
            viewport.scrollTop = 500;
        };

        // Configuration visuelle dynamique selon les critères tactiques
        function getTacticalStyle(type, status) {
            if (status === 'fausse_alerte') return { color: '#EE82EE', fill: 'rgba(238, 130, 238, 0.4)', pulse: false };
            if (status === 'infiltration') return { color: '#9400D3', fill: 'rgba(148, 0, 211, 0.5)', pulse: true };
            if (type === 'done') return { color: '#00FF00', fill: 'rgba(0, 255, 0, 0.2)', pulse: false };
            
            if (type === 'grief') return { color: '#FF0000', fill: 'rgba(255, 0, 0, 0.4)', pulse: true };
            if (type === 'build') return { color: '#00A2FF', fill: 'rgba(0, 162, 255, 0.3)', pulse: true };
            return { color: '#ffffff', fill: 'rgba(0, 255, 0, 0.8)', pulse: false }; // Actu
        }

        function createVisualZone(event) {
            if(document.getElementById(`zone-${event.id}`)) return;

            const zone = document.createElement('div');
            zone.className = 'tactical-zone';
            zone.id = `zone-${event.id}`;
            
            const style = getTacticalStyle(event.type, event.status);
            if(style.pulse) zone.classList.add('pulse-anim');

            // Conversion des dimensions géométriques : si aucun rayon, taille standard d'un marqueur (24px)
            const diameter = event.radius && event.radius > 0 ? (event.radius * 2) : 24;
            zone.style.width = `${diameter}px`;
            zone.style.height = `${diameter}px`;
            zone.style.borderColor = style.color;
            zone.style.backgroundColor = style.fill;

            // Placement repère sur le planisphère (Canevas 2000x2000 avec 0,0 positionné au centre)
            const centerX = 1000;
            const centerY = 1000;
            const posX = centerX + event.x; 
            const posY = centerY - event.y; 

            zone.style.left = `${posX}px`;
            zone.style.top = `${posY}px`;

            // Fiche descriptive au format HTML
            const popup = document.createElement('div');
            popup.className = 'marker-popup';
            popup.innerHTML = `
                <b style="color:${style.color}; text-transform:uppercase;">[${event.status ? event.status.toUpperCase() : event.type.toUpperCase()}] #${event.id}</b><br>
                <b>Secteur :</b> X: ${event.x} Y: ${event.y}<br>
                <b>Intel :</b> ${event.author || 'Alerte Auto'}<br>
                <hr style="border:0; border-top:1px solid #444; margin:4px 0;">
                <span>"${event.description}"</span>
            `;
            
            zone.appendChild(popup);
            grid.appendChild(zone);
        }

        async function fetchTacticalIntel() {
            try {
                const response = await fetch("https://supabase.co" + Date.now(), {
                    method: 'GET',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });
                
                if (!response.ok) throw new Error('Erreur réseau');
                const data = await response.json();
                
                // Nettoyage immédiat des zones si supprimées de la BDD
                const activeIds = data.map(e => `zone-${e.id}`);
                const currentZones = document.querySelectorAll('.tactical-zone');
                currentZones.forEach(z => {
                    if(!activeIds.includes(z.id)) z.remove();
                });

                data.forEach(event => createVisualZone(event));
            } catch (err) {
                console.error("Erreur de liaison tactique :", err);
            }
        }

        fetchTacticalIntel();
        // Requête de synchronisation de la BDD toutes les 3 secondes
        setInterval(fetchTacticalIntel, 3000);
    </script>
</body>
</html>
