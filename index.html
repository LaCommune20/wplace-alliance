<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>WPlace Alliance</title>


    <!-- =========================================================
         MAPLIBRE
         ========================================================= -->

    <link
        href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css"
        rel="stylesheet"
    >

    <script
        src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js">
    </script>


    <!-- =========================================================
         STYLE
         ========================================================= -->

    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #111;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

        }


        #map {

            width: 100%;
            height: 100%;

        }


        /* =====================================================
           PANNEAU PRINCIPAL
           ===================================================== */

        #panel {

            position: absolute;

            top: 15px;
            left: 15px;

            z-index: 1000;

            min-width: 245px;

            padding: 14px 17px;

            background:
                rgba(15, 15, 15, 0.93);

            border:
                1px solid
                rgba(255, 255, 255, 0.15);

            border-radius: 9px;

            box-shadow:
                0 5px 25px
                rgba(0, 0, 0, 0.45);

            color: white;

            user-select: none;

        }


        #title {

            font-size: 19px;

            font-weight: bold;

            letter-spacing: 0.2px;

        }


        #subtitle {

            margin-top: 4px;

            color: #999;

            font-size: 12px;

        }


        #info {

            margin-top: 12px;

            padding-top: 10px;

            border-top:
                1px solid
                rgba(255, 255, 255, 0.1);

            color: #aaa;

            font-family:
                Consolas,
                monospace;

            font-size: 11px;

            line-height: 1.6;

        }


        /* =====================================================
           STATUS
           ===================================================== */

        #status {

            position: absolute;

            left: 15px;
            bottom: 15px;

            z-index: 1000;

            padding: 8px 12px;

            background:
                rgba(15, 15, 15, 0.93);

            border:
                1px solid
                rgba(255, 255, 255, 0.12);

            border-radius: 6px;

            color: #aaa;

            font-family:
                Consolas,
                monospace;

            font-size: 11px;

            pointer-events: none;

        }


        /* =====================================================
           COORDONNÉES
           ===================================================== */

        #coordinates {

            position: absolute;

            right: 15px;
            bottom: 15px;

            z-index: 1000;

            padding: 8px 12px;

            background:
                rgba(15, 15, 15, 0.93);

            border:
                1px solid
                rgba(255, 255, 255, 0.12);

            border-radius: 6px;

            color: #aaa;

            font-family:
                Consolas,
                monospace;

            font-size: 11px;

            pointer-events: none;

        }


        /* =====================================================
           MAPLIBRE
           ===================================================== */

        .maplibregl-ctrl-attrib {

            background:
                rgba(0, 0, 0, 0.65) !important;

            color: #aaa;

        }


        .maplibregl-ctrl-attrib a {

            color: #ddd;

        }


        .maplibregl-ctrl-group {

            background:
                rgba(20, 20, 20, 0.9) !important;

        }


        .maplibregl-ctrl-group button {

            filter:
                invert(1);

        }

    </style>

</head>


<body>


    <!-- =========================================================
         CARTE
         ========================================================= -->

    <div id="map"></div>


    <!-- =========================================================
         INTERFACE
         ========================================================= -->

    <div id="panel">

        <div id="title">
            WPlace Alliance
        </div>

        <div id="subtitle">
            Carte tactique de l'alliance
        </div>

        <div id="info">

            Zoom :
            <span id="zoom">
                —
            </span>

            <br>

            Tuile WPlace :
            <span id="tile">
                —
            </span>

            <br>

            Tuiles chargées :
            <span id="tiles">
                0
            </span>

        </div>

    </div>


    <div id="status">
        Initialisation...
    </div>


    <div id="coordinates">
        X: — &nbsp; Y: —
    </div>


    <!-- =========================================================
         JAVASCRIPT
         ========================================================= -->

    <script>


        /*
         * =========================================================
         *
         * WPLACE ALLIANCE
         *
         * Première vraie carte
         *
         * =========================================================
         */


        /*
         * ---------------------------------------------------------
         * CONSTANTES WPLACE
         * ---------------------------------------------------------
         *
         * Le monde WPlace :
         *
         * 2048 × 2048 tuiles
         *
         * Chaque tuile :
         *
         * 1000 × 1000 pixels
         *
         * Le niveau natif :
         *
         * 11
         *
         * car :
         *
         * 2^11 = 2048
         *
         */


        const WPLACE_ZOOM = 11;

        const WPLACE_TILES = 2048;

        const WPLACE_TILE_SIZE = 1000;


        /*
         * ---------------------------------------------------------
         * COORDONNÉES INITIALES
         * ---------------------------------------------------------
         *
         * Toulon
         *
         */


        const INITIAL_LONGITUDE =
            5.93;


        const INITIAL_LATITUDE =
            43.12;


        const INITIAL_ZOOM =
            7;


        /*
         * ---------------------------------------------------------
         * CONVERSION
         * ---------------------------------------------------------
         *
         * WPlace utilise la formule Slippy Map standard.
         *
         * ---------------------------------------------------------
         */


        function longitudeToTileX(
            longitude
        ) {

            const n =
                WPLACE_TILES;


            return (
                (longitude + 180) /
                360
            ) * n;

        }


        function latitudeToTileY(
            latitude
        ) {

            const latRad =
                latitude *
                Math.PI /
                180;


            const n =
                WPLACE_TILES;


            return (
                (
                    1 -
                    Math.asinh(
                        Math.tan(
                            latRad
                        )
                    ) /
                    Math.PI
                ) /
                2
            ) * n;

        }


        /*
         * ---------------------------------------------------------
         * CONVERSION INVERSE
         * ---------------------------------------------------------
         */


        function tileXToLongitude(
            x
        ) {

            return (
                x /
                WPLACE_TILES
            ) * 360 - 180;

        }


        function tileYToLatitude(
            y
        ) {

            const n =
                WPLACE_TILES;


            const latRad =
                Math.atan(
                    Math.sinh(
                        Math.PI *
                        (
                            1 -
                            2 *
                            y /
                            n
                        )
                    )
                );


            return (
                latRad *
                180 /
                Math.PI
            );

        }


        /*
         * ---------------------------------------------------------
         * VÉRIFICATION DE LA CONVERSION
         * ---------------------------------------------------------
         */


        console.log(
            "========================================"
        );


        console.log(
            "WPlace Alliance"
        );


        console.log(
            "Test de conversion WPlace"
        );


        const testX =
            longitudeToTileX(
                INITIAL_LONGITUDE
            );


        const testY =
            latitudeToTileY(
                INITIAL_LATITUDE
            );


        console.log(
            "Toulon → tuile :",
            Math.floor(testX),
            Math.floor(testY)
        );


        console.log(
            "Toulon → coordonnées exactes :",
            testX,
            testY
        );


        console.log(
            "Tuile → longitude :",
            tileXToLongitude(
                Math.floor(testX)
            )
        );


        console.log(
            "Tuile → latitude :",
            tileYToLatitude(
                Math.floor(testY)
            )
        );


        console.log(
            "========================================"
        );


        /*
         * ---------------------------------------------------------
         * STYLE MAPLIBRE
         * ---------------------------------------------------------
         *
         * OpenFreeMap Liberty.
         *
         * Aucun token nécessaire.
         *
         */


        const map =
            new maplibregl.Map({

                container:
                    "map",

                style:
                    "https://tiles.openfreemap.org/styles/liberty",

                center:
                    [
                        INITIAL_LONGITUDE,
                        INITIAL_LATITUDE
                    ],

                zoom:
                    INITIAL_ZOOM,

                minZoom:
                    0,

                maxZoom:
                    13,

                attributionControl:
                    true

            });


        /*
         * ---------------------------------------------------------
         * CONTRÔLES
         * ---------------------------------------------------------
         */


        map.addControl(
            new maplibregl.NavigationControl(),
            "top-right"
        );


        /*
         * ---------------------------------------------------------
         * CHARGEMENT DE LA CARTE
         * ---------------------------------------------------------
         */


        map.on(
            "load",
            function () {


                console.log(
                    "Fond OpenFreeMap chargé"
                );


                /*
                 * -------------------------------------------------
                 * SOURCE WPLACE
                 * -------------------------------------------------
                 *
                 * Les tuiles natives sont au zoom 11.
                 *
                 * Nous les affichons comme couche raster.
                 *
                 */


                map.addSource(
                    "wplace",
                    {

                        type:
                            "raster",

                        tiles:
                            [
                                "https://backend.wplace.live/files/s0/tiles/{x}/{y}.png"
                            ],

                        tileSize:
                            512,

                        minzoom:
                            WPLACE_ZOOM,

                        maxzoom:
                            WPLACE_ZOOM,

                        attribution:
                            "WPlace"

                    }
                );


                /*
                 * -------------------------------------------------
                 * COUCHE WPLACE
                 * -------------------------------------------------
                 */


                map.addLayer({

                    id:
                        "wplace-layer",

                    type:
                        "raster",

                    source:
                        "wplace",

                    minzoom:
                        WPLACE_ZOOM,

                    maxzoom:
                        13,

                    paint:
                        {

                            "raster-opacity":
                                1.0,

                            "raster-fade-duration":
                                0

                        }

                });


                /*
                 * -------------------------------------------------
                 * STATUS
                 * -------------------------------------------------
                 */


                document
                    .getElementById(
                        "status"
                    )
                    .textContent =
                    "Carte prête — zoome jusqu'au niveau 11";


                updateInterface();


            }
        );


        /*
         * ---------------------------------------------------------
         * SOURCES / ERREURS
         * ---------------------------------------------------------
         */


        map.on(
            "error",
            function (event) {

                console.error(
                    "MapLibre :",
                    event
                );

            }
        );


        /*
         * ---------------------------------------------------------
         * INTERFACE
         * ---------------------------------------------------------
         */


        function updateInterface() {


            const zoom =
                map.getZoom();


            document
                .getElementById(
                    "zoom"
                )
                .textContent =
                zoom.toFixed(2);


            /*
             * Position actuelle
             */


            const center =
                map.getCenter();


            const x =
                longitudeToTileX(
                    center.lng
                );


            const y =
                latitudeToTileY(
                    center.lat
                );


            document
                .getElementById(
                    "tile"
                )
                .textContent =
                Math.floor(x) +
                " / " +
                Math.floor(y);


        }


        /*
         * ---------------------------------------------------------
         * SOURIS
         * ---------------------------------------------------------
         */


        map.on(
            "mousemove",
            function (event) {


                const longitude =
                    event.lngLat.lng;


                const latitude =
                    event.lngLat.lat;


                const x =
                    longitudeToTileX(
                        longitude
                    );


                const y =
                    latitudeToTileY(
                        latitude
                    );


                const tileX =
                    Math.floor(x);


                const tileY =
                    Math.floor(y);


                const pixelX =
                    Math.floor(
                        (
                            x -
                            tileX
                        ) *
                        WPLACE_TILE_SIZE
                    );


                const pixelY =
                    Math.floor(
                        (
                            y -
                            tileY
                        ) *
                        WPLACE_TILE_SIZE
                    );


                document
                    .getElementById(
                        "coordinates"
                    )
                    .textContent =
                    "Tuile " +
                    tileX +
                    " / " +
                    tileY +
                    "   Pixel " +
                    pixelX +
                    " / " +
                    pixelY;


            }
        );


        /*
         * ---------------------------------------------------------
         * DÉPLACEMENT / ZOOM
         * ---------------------------------------------------------
         */


        map.on(
            "move",
            function () {

                updateInterface();

            }
        );


        map.on(
            "zoom",
            function () {

                updateInterface();


                const zoom =
                    map.getZoom();


                if (
                    zoom <
                    WPLACE_ZOOM
                ) {

                    document
                        .getElementById(
                            "status"
                        )
                        .textContent =
                        "Fond géographique — zoom " +
                        zoom.toFixed(1) +
                        " / 11";


                } else {

                    document
                        .getElementById(
                            "status"
                        )
                        .textContent =
                        "Pixels WPlace actifs — zoom " +
                        zoom.toFixed(1);

                }

            }
        );


    </script>


</body>

</html>
