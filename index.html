<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>WPlace Alliance</title>

    <!-- Leaflet -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        crossorigin=""
    >

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #111;
            color: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        #map {
            width: 100%;
            height: 100%;
            background: #202020;
        }

        /*
         * Interface supérieure
         */

        #topbar {

            position: absolute;

            top: 15px;
            left: 15px;

            z-index: 1000;

            padding: 12px 18px;

            background:
                rgba(15, 15, 15, 0.92);

            border:
                1px solid
                rgba(255, 255, 255, 0.15);

            border-radius: 8px;

            box-shadow:
                0 4px 20px
                rgba(0, 0, 0, 0.45);

            user-select: none;
        }

        #title {

            font-size: 18px;
            font-weight: bold;

            margin-bottom: 4px;
        }

        #subtitle {

            color: #999;

            font-size: 12px;
        }

        /*
         * Informations en bas
         */

        #status {

            position: absolute;

            left: 15px;
            bottom: 15px;

            z-index: 1000;

            padding: 8px 12px;

            background:
                rgba(15, 15, 15, 0.92);

            border:
                1px solid
                rgba(255, 255, 255, 0.12);

            border-radius: 6px;

            color: #aaa;

            font-size: 12px;

            pointer-events: none;
        }

        /*
         * Coordonnées
         */

        #coordinates {

            position: absolute;

            right: 15px;
            bottom: 15px;

            z-index: 1000;

            padding: 8px 12px;

            background:
                rgba(15, 15, 15, 0.92);

            border:
                1px solid
                rgba(255, 255, 255, 0.12);

            border-radius: 6px;

            color: #aaa;

            font-size: 12px;

            pointer-events: none;
        }

        /*
         * Apparence des tuiles
         */

        .wplace-tile {

            image-rendering: auto;

            background: #222;

            border: none;
        }

        /*
         * Attribution
         */

        .leaflet-control-attribution {

            background:
                rgba(0, 0, 0, 0.65) !important;

            color: #aaa;

        }

        .leaflet-control-attribution a {

            color: #ddd;

        }

    </style>

</head>


<body>


    <!-- Carte -->

    <div id="map"></div>


    <!-- Interface -->

    <div id="topbar">

        <div id="title">
            WPlace Alliance
        </div>

        <div id="subtitle">
            Carte tactique de l'alliance
        </div>

    </div>


    <div id="status">
        Initialisation de la carte...
    </div>


    <div id="coordinates">
        X: — &nbsp;&nbsp; Y: —
    </div>


    <!-- Leaflet -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        crossorigin="">
    </script>


    <script>

        /*
         * ============================================================
         * WPLACE ALLIANCE
         * Carte WPlace
         * ============================================================
         *
         * WPlace :
         *
         * - 2048 × 2048 tuiles
         * - chaque tuile = 1000 × 1000 pixels
         *
         * Les tuiles sont accessibles via :
         *
         * https://backend.wplace.live/files/s0/tiles/X/Y.png
         *
         * ============================================================
         */


        /*
         * ------------------------------------------------------------
         * CONSTANTES WPLACE
         * ------------------------------------------------------------
         */

        const TILE_SIZE = 1000;

        const TILE_COUNT = 2048;

        const WORLD_SIZE =
            TILE_SIZE * TILE_COUNT;


        /*
         * ------------------------------------------------------------
         * CRS PERSONNALISÉ
         * ------------------------------------------------------------
         *
         * On utilise CRS.Simple car WPlace est une grille.
         *
         * On modifie son échelle pour que :
         *
         * zoom 0  = 1 tuile
         * zoom 1  = 2 × 2 tuiles
         * ...
         * zoom 11 = 2048 × 2048 tuiles
         *
         * 2^11 = 2048
         */

        const WPlaceCRS = L.extend(
            {},
            L.CRS.Simple
        );


        WPlaceCRS.scale = function (zoom) {

            return TILE_SIZE *
                Math.pow(2, zoom);

        };


        WPlaceCRS.zoom = function (scale) {

            return Math.log(
                scale / TILE_SIZE
            ) / Math.LN2;

        };


        /*
         * ------------------------------------------------------------
         * CARTE
         * ------------------------------------------------------------
         */

        const map = L.map(
            "map",
            {

                crs: WPlaceCRS,

                minZoom: 0,

                maxZoom: 11,

                zoomControl: true,

                attributionControl: true,

                worldCopyJump: false

            }
        );


        /*
         * ------------------------------------------------------------
         * COUCHE DE TUILES WPLACE
         * ------------------------------------------------------------
         *
         * On utilise GridLayer plutôt que TileLayer.
         *
         * Cela nous permet de contrôler directement :
         *
         *     coords.x
         *     coords.y
         *
         * et donc de les envoyer à WPlace.
         */

        const WPlaceLayer =
            L.GridLayer.extend({

                createTile: function (
                    coords,
                    done
                ) {

                    const tile =
                        document.createElement(
                            "img"
                        );


                    /*
                     * Taille physique de la tuile.
                     */

                    const size =
                        this.getTileSize();


                    tile.width =
                        size.x;

                    tile.height =
                        size.y;


                    tile.className =
                        "wplace-tile";


                    /*
                     * Pas de tuile négative.
                     */

                    if (
                        coords.x < 0 ||
                        coords.y < 0 ||
                        coords.x >= TILE_COUNT ||
                        coords.y >= TILE_COUNT
                    ) {

                        tile.style.visibility =
                            "hidden";

                        setTimeout(
                            function () {

                                done(
                                    null,
                                    tile
                                );

                            },
                            0
                        );

                        return tile;

                    }


                    /*
                     * URL officielle de la tuile.
                     */

                    const url =
                        "https://backend.wplace.live" +
                        "/files/s0/tiles/" +
                        coords.x +
                        "/" +
                        coords.y +
                        ".png";


                    /*
                     * Quand l'image est chargée.
                     */

                    tile.onload =
                        function () {

                            done(
                                null,
                                tile
                            );

                            updateStatus();

                        };


                    /*
                     * En cas d'erreur.
                     */

                    tile.onerror =
                        function (error) {

                            console.error(
                                "Erreur tuile WPlace :",
                                coords.x,
                                coords.y,
                                error
                            );

                            tile.style.background =
                                "#222";

                            done(
                                null,
                                tile
                            );

                            updateStatus();

                        };


                    /*
                     * Chargement.
                     */

                    tile.src = url;


                    return tile;

                },

                tileSize: TILE_SIZE,

                minZoom: 0,

                maxZoom: 11,

                noWrap: true,

                updateWhenIdle: true,

                keepBuffer: 2

            });


        const wplace =
            new WPlaceLayer();


        wplace.addTo(map);


        /*
         * ------------------------------------------------------------
         * LIMITES DE LA CARTE
         * ------------------------------------------------------------
         *
         * Notre espace de coordonnées :
         *
         * X = 0 → 2048
         * Y = 0 → 2048
         */

        const worldBounds =
            L.latLngBounds(
                [
                    0,
                    0
                ],
                [
                    TILE_COUNT,
                    TILE_COUNT
                ]
            );


        map.setMaxBounds(
            worldBounds
        );


        /*
         * ------------------------------------------------------------
         * POSITION INITIALE
         * ------------------------------------------------------------
         */

        map.fitBounds(
            worldBounds
        );


        /*
         * ------------------------------------------------------------
         * STATUS
         * ------------------------------------------------------------
         */

        const status =
            document.getElementById(
                "status"
            );


        function updateStatus() {

            status.textContent =
                "Carte WPlace active";

        }


        /*
         * ------------------------------------------------------------
         * COORDONNÉES DE LA SOURIS
         * ------------------------------------------------------------
         */

        const coordinates =
            document.getElementById(
                "coordinates"
            );


        map.on(
            "mousemove",
            function (event) {

                const x =
                    Math.floor(
                        event.latlng.lng
                    );

                const y =
                    Math.floor(
                        event.latlng.lat
                    );


                coordinates.textContent =
                    "X: " +
                    x +
                    "   Y: " +
                    y;

            }
        );


        /*
         * ------------------------------------------------------------
         * DEBUG
         * ------------------------------------------------------------
         */

        console.log(
            "WPlace Alliance initialisé"
        );

        console.log(
            "Taille du monde :",
            TILE_COUNT,
            "×",
            TILE_COUNT
        );

        console.log(
            "Taille d'une tuile :",
            TILE_SIZE,
            "×",
            TILE_SIZE
        );


    </script>


</body>

</html>
