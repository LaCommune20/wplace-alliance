<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WPlace Alliance</title>

    <!-- Leaflet -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIINfQ3T3m5eM0rQbZ9v6Ff7Y0Q9E4f5x0="
        crossorigin=""
    >

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
            font-family: Arial, sans-serif;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        #title {
            position: absolute;
            z-index: 1000;
            top: 15px;
            left: 15px;

            padding: 12px 18px;

            background: rgba(15, 15, 15, 0.9);
            color: white;

            border: 1px solid #444;
            border-radius: 8px;

            font-size: 18px;
            font-weight: bold;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        #status {
            position: absolute;
            z-index: 1000;
            bottom: 15px;
            left: 15px;

            padding: 8px 12px;

            background: rgba(15, 15, 15, 0.9);
            color: #aaa;

            border-radius: 6px;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div id="title">
        WPlace Alliance
    </div>

    <div id="status">
        Chargement de la carte...
    </div>

    <div id="map"></div>

    <!-- Leaflet -->
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin="">
    </script>

    <script>
        /*
         * WPlace Alliance
         * Première version :
         * carte WPlace uniquement.
         */

        const map = L.map("map", {
            crs: L.CRS.Simple,

            minZoom: 0,
            maxZoom: 11,

            zoomControl: true,

            attributionControl: true
        });

        /*
         * WPlace utilise des tuiles de 1000x1000 pixels.
         *
         * On commence avec une seule source de tuiles.
         */

        const tileLayer = L.tileLayer(
            "https://backend.wplace.live/files/s0/tiles/{x}/{y}.png",
            {
                tileSize: 1000,

                minZoom: 0,
                maxZoom: 11,

                noWrap: true,

                attribution: "WPlace"
            }
        );

        tileLayer.addTo(map);

        /*
         * Monde WPlace :
         *
         * Les coordonnées de tuiles vont jusqu'à 2048 × 2048.
         */

        const worldSize = 2048 * 1000;

        const southWest = [0, 0];
        const northEast = [worldSize, worldSize];

        const bounds = L.latLngBounds(
            southWest,
            northEast
        );

        map.setMaxBounds(bounds);

        /*
         * Vue initiale.
         */

        map.fitBounds(bounds);

        /*
         * Indication de chargement.
         */

        tileLayer.on("load", function () {
            document.getElementById("status").textContent =
                "Carte WPlace chargée";
        });

        tileLayer.on("tileerror", function () {
            document.getElementById("status").textContent =
                "Erreur lors du chargement d'une tuile WPlace";
        });
    </script>

</body>
</html>
