<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>WPlace Alliance - Test carte</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            background: #111;
            color: white;

            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #header {
            width: 100%;

            padding: 15px 20px;

            background: #151515;

            border-bottom: 1px solid #333;
        }

        #title {
            font-size: 20px;
            font-weight: bold;
        }

        #subtitle {
            margin-top: 5px;

            color: #999;

            font-size: 13px;
        }

        #status {
            width: 100%;

            padding: 10px 20px;

            background: #1d1d1d;

            border-bottom: 1px solid #333;

            color: #aaa;

            font-size: 13px;
        }

        #test-container {
            margin-top: 30px;

            width: min(1000px, 90vw);
            height: min(1000px, 70vh);

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: auto;

            background: #222;

            border: 2px solid #444;
        }

        #wplace-tile {
            display: block;

            width: 1000px;
            height: 1000px;

            max-width: none;

            background: #333;

            image-rendering: auto;
        }

        #error {
            display: none;

            margin-top: 20px;

            width: min(900px, 90vw);

            padding: 15px;

            background: #351515;

            border: 1px solid #7a3333;

            color: #ffaaaa;

            font-family: monospace;

            white-space: pre-wrap;
        }

        #success {
            display: none;

            margin-top: 20px;

            width: min(900px, 90vw);

            padding: 15px;

            background: #15351c;

            border: 1px solid #347a42;

            color: #aaffb4;

            font-family: monospace;
        }

        #url {
            margin-top: 10px;

            width: min(900px, 90vw);

            color: #777;

            font-size: 12px;

            word-break: break-all;
        }

    </style>
</head>


<body>


    <div id="header">

        <div id="title">
            WPlace Alliance
        </div>

        <div id="subtitle">
            Test direct d'une tuile WPlace
        </div>

    </div>


    <div id="status">
        Chargement d'une tuile WPlace...
    </div>


    <div id="test-container">

        <img
            id="wplace-tile"
            alt="Tuile WPlace"
        >

    </div>


    <div id="success">

        TUile WPlace chargée correctement.

        Le serveur WPlace répond et le navigateur peut afficher
        directement une tuile PNG.

    </div>


    <div id="error">

        ERREUR DE CHARGEMENT

    </div>


    <div id="url"></div>


    <script>

        /*
         * ============================================================
         * TEST DIRECT WPLACE
         * ============================================================
         *
         * Cette tuile est un exemple fourni dans la documentation
         * du protocole WPlace.
         *
         * Tile X = 1672
         * Tile Y = 892
         *
         * Taille :
         * 1000 × 1000 pixels
         *
         * ============================================================
         */


        const tileX = 1672;

        const tileY = 892;


        const tileURL =
            "https://backend.wplace.live" +
            "/files/s0/tiles/" +
            tileX +
            "/" +
            tileY +
            ".png";


        const image =
            document.getElementById(
                "wplace-tile"
            );


        const status =
            document.getElementById(
                "status"
            );


        const success =
            document.getElementById(
                "success"
            );


        const error =
            document.getElementById(
                "error"
            );


        const url =
            document.getElementById(
                "url"
            );


        /*
         * Affichage de l'URL testée.
         */

        url.textContent =
            tileURL;


        /*
         * Succès.
         */

        image.onload =
            function () {

                console.log(
                    "Tuile WPlace chargée :",
                    tileURL
                );


                console.log(
                    "Dimensions naturelles :",
                    image.naturalWidth,
                    "×",
                    image.naturalHeight
                );


                status.textContent =
                    "Tuile WPlace chargée";


                success.style.display =
                    "block";

            };


        /*
         * Erreur.
         */

        image.onerror =
            function (event) {

                console.error(
                    "Impossible de charger la tuile WPlace",
                    event
                );


                status.textContent =
                    "Erreur de chargement de la tuile";


                error.style.display =
                    "block";


                error.textContent =
                    "Impossible de charger :\n\n" +
                    tileURL +
                    "\n\n" +
                    "Consulte F12 → Réseau (Network) " +
                    "pour voir la requête PNG.";

            };


        /*
         * Lancement.
         */

        console.log(
            "Test WPlace :",
            tileURL
        );


        image.src =
            tileURL;


    </script>


</body>

</html>
