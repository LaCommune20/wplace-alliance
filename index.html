<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>WPlace - La Commune</title>


    <!-- =========================================================
         MAPLIBRE
         ========================================================= -->

    <link
        href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css"
        rel="stylesheet"
    >

    <script
        src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js">
    </script>


    <!-- =========================================================
         STYLE
         ========================================================= -->

    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #111;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

        }


        #map {

            width: 100%;
            height: 100%;

        }


        /* =====================================================
           PANNEAU PRINCIPAL
           ===================================================== */

        #panel {

            position: absolute;

            top: 15px;
            left: 15px;

            z-index: 1000;

            min-width: 295px;

            padding: 14px 17px;

            background:
                rgba(15, 15, 15, 0.94);

            border:
                1px solid
                rgba(255, 255, 255, 0.15);

            border-radius: 9px;

            box-shadow:
                0 5px 25px
                rgba(0, 0, 0, 0.45);

            color: white;

            user-select: none;

        }


        #title {

            font-size: 19px;

            font-weight: bold;

        }


        #subtitle {

            margin-top: 4px;

            color: #999;

            font-size: 12px;

        }


        #info {

            margin-top: 12px;

            padding-top: 10px;

            border-top:
                1px solid
                rgba(255, 255, 255, 0.1);

            color: #aaa;

            font-family:
                Consolas,
                monospace;

            font-size: 11px;

            line-height: 1.7;

        }


        /* =====================================================
           STATUT
           ===================================================== */

        #status {

            position: absolute;

            left: 15px;
            bottom: 15px;

            z-index: 1000;

            padding: 8px 12px;

            background:
                rgba(15, 15, 15, 0.94);

            border:
                1px solid
                rgba(255, 255, 255, 0.12);

            border-radius: 6px;

            color: #aaa;

            font-family:
                Consolas,
                monospace;

            font-size: 11px;

            pointer-events: none;

        }


        /* =====================================================
           COORDONNÉES SOURIS
           ===================================================== */

        #coordinates {

            position: absolute;

            right: 15px;
            bottom: 15px;

            z-index: 1000;

            padding: 8px 12px;

            background:
                rgba(15, 15, 15, 0.94);

            border:
                1px solid
                rgba(255, 255, 255, 0.12);

            border-radius: 6px;

            color: #aaa;

            font-family:
                Consolas,
                monospace;

            font-size: 11px;

            pointer-events: none;

        }


        /* =====================================================
           MAPLIBRE
           ===================================================== */

        .maplibregl-ctrl-attrib {

            background:
                rgba(0, 0, 0, 0.65) !important;

            color: #aaa;

        }


        .maplibregl-ctrl-attrib a {

            color: #ddd;

        }


        .maplibregl-ctrl-group {

            background:
                rgba(20, 20, 20, 0.9) !important;

        }


        .maplibregl-ctrl-group button {

            filter:
                invert(1);

        }

    </style>

</head>


<body>


    <!-- =========================================================
         CARTE
         ========================================================= -->

    <div id="map"></div>


    <!-- =========================================================
         PANNEAU
         ========================================================= -->

    <div id="panel">

        <div id="title">
            WPlace Bergamottto
        </div>

        <div id="subtitle">
            Carte tactique de La Commune et de ses alliés
        </div>

        <div id="info">

            Zoom :
            <span id="zoom">
                —
            </span>

            <br>

            Tuile WPlace :
            <span id="tile">
                —
            </span>

            <br>

            Pixel :
            <span id="pixel">
                —
            </span>

            <br>

            Tuiles visibles :
            <span id="visibleTiles">
                0
            </span>

            <br>

            Tuiles en mémoire :
            <span id="loadedTiles">
                0
            </span>

        </div>

    </div>


    <!-- =========================================================
         STATUT
         ========================================================= -->

    <div id="status">
        Initialisation de la carte...
    </div>


    <!-- =========================================================
         COORDONNÉES
         ========================================================= -->

    <div id="coordinates">
        Tuile — / — &nbsp; Pixel — / —
    </div>


    <!-- =========================================================
         JAVASCRIPT
         ========================================================= -->

    <script>


        /*
         * =========================================================
         *
         * WPLACE BERGAMOTTTO
         *
         * Carte tactique de La Commune et de ses alliés
         *
         * =========================================================
         */


        /*
         * =========================================================
         * CONFIGURATION WPLACE
         * =========================================================
         */


        const WPLACE_TILE_COUNT =
            2048;


        const WPLACE_TILE_SIZE =
            1000;


        const WPLACE_WORLD_SIZE =
            WPLACE_TILE_COUNT *
            WPLACE_TILE_SIZE;


        /*
         * Le niveau natif des tuiles WPlace.
         */


        const WPLACE_NATIVE_ZOOM =
            11;


        /*
         * En dessous de ce zoom, on n'affiche pas encore
         * les pixels WPlace.
         *
         * Cela évite de charger énormément de tuiles
         * lorsqu'on regarde une région très éloignée.
         */


        const WPLACE_MIN_DISPLAY_ZOOM =
            9;


        /*
         * Marge autour de la zone visible.
         *
         * 1 = on garde une rangée de tuiles autour de
         * l'écran afin d'éviter les trous pendant les déplacements.
         */


        const TILE_PADDING =
            1;


        /*
         * Sécurité :
         *
         * nombre maximal de tuiles WPlace que cette version
         * peut charger simultanément.
         *
         * Nous augmenterons éventuellement cette valeur
         * lorsque les zones de l'alliance seront branchées.
         */


        const MAX_LOADED_TILES =
            100;


        /*
         * =========================================================
         * WORKER CLOUDFLARE
         * =========================================================
         */


        const WPLACE_PROXY =
            "https://wplace-commune-proxy.mathieu-peter.workers.dev";


        /*
         * =========================================================
         * POSITION INITIALE
         * =========================================================
         *
         * Toulon
         *
         */


        const INITIAL_LONGITUDE =
            5.93;


        const INITIAL_LATITUDE =
            43.12;


        /*
         * On commence directement à 9 pour que les pixels
         * soient visibles lors du premier chargement.
         */


        const INITIAL_ZOOM =
            9;


        /*
         * =========================================================
         * CONVERSION LONGITUDE → MONDE WPLACE
         * =========================================================
         */


        function longitudeToWorldX(
            longitude
        ) {

            return (
                (
                    longitude +
                    180
                ) /
                360
            ) *
            WPLACE_WORLD_SIZE;

        }


        /*
         * =========================================================
         * CONVERSION LATITUDE → MONDE WPLACE
         * =========================================================
         */


        function latitudeToWorldY(
            latitude
        ) {

            const latitudeRadians =
                latitude *
                Math.PI /
                180;


            const mercator =
                Math.log(
                    Math.tan(
                        Math.PI / 4 +
                        latitudeRadians / 2
                    )
                );


            return (
                (
                    1 -
                    mercator /
                    Math.PI
                ) /
                2
            ) *
            WPLACE_WORLD_SIZE;

        }


        /*
         * =========================================================
         * MONDE WPLACE → COORDONNÉES TUILE
         * =========================================================
         */


        function worldToWplace(
            worldX,
            worldY
        ) {


            let tileX =
                Math.floor(
                    worldX /
                    WPLACE_TILE_SIZE
                );


            let tileY =
                Math.floor(
                    worldY /
                    WPLACE_TILE_SIZE
                );


            const pixelX =
                Math.floor(
                    worldX -
                    tileX *
                    WPLACE_TILE_SIZE
                );


            const pixelY =
                Math.floor(
                    worldY -
                    tileY *
                    WPLACE_TILE_SIZE
                );


            tileX =
                Math.max(
                    0,
                    Math.min(
                        WPLACE_TILE_COUNT - 1,
                        tileX
                    )
                );


            tileY =
                Math.max(
                    0,
                    Math.min(
                        WPLACE_TILE_COUNT - 1,
                        tileY
                    )
                );


            return {

                tileX,
                tileY,

                pixelX,
                pixelY

            };

        }


        /*
         * =========================================================
         * MONDE X → LONGITUDE
         * =========================================================
         */


        function worldXToLongitude(
            worldX
        ) {

            return (
                (
                    worldX /
                    WPLACE_WORLD_SIZE
                ) *
                360
            ) - 180;

        }


        /*
         * =========================================================
         * MONDE Y → LATITUDE
         * =========================================================
         */


        function worldYToLatitude(
            worldY
        ) {


            const normalized =
                worldY /
                WPLACE_WORLD_SIZE;


            const mercatorY =
                Math.PI *
                (
                    1 -
                    2 *
                    normalized
                );


            return (
                Math.atan(
                    Math.sinh(
                        mercatorY
                    )
                ) *
                180 /
                Math.PI
            );

        }


        /*
         * =========================================================
         * COORDONNÉES D'UNE TUILE
         * =========================================================
         */


        function getTileCoordinates(
            tileX,
            tileY
        ) {


            const worldWest =
                tileX *
                WPLACE_TILE_SIZE;


            const worldEast =
                (
                    tileX +
                    1
                ) *
                WPLACE_TILE_SIZE;


            const worldNorth =
                tileY *
                WPLACE_TILE_SIZE;


            const worldSouth =
                (
                    tileY +
                    1
                ) *
                WPLACE_TILE_SIZE;


            const west =
                worldXToLongitude(
                    worldWest
                );


            const east =
                worldXToLongitude(
                    worldEast
                );


            const north =
                worldYToLatitude(
                    worldNorth
                );


            const south =
                worldYToLatitude(
                    worldSouth
                );


            return [

                [
                    west,
                    north
                ],

                [
                    east,
                    north
                ],

                [
                    east,
                    south
                ],

                [
                    west,
                    south
                ]

            ];

        }


        /*
         * =========================================================
         * MAPLIBRE
         * =========================================================
         */


        const map =
            new maplibregl.Map({

                container:
                    "map",

                style:
                    "https://tiles.openfreemap.org/styles/liberty",

                center:
                    [
                        INITIAL_LONGITUDE,
                        INITIAL_LATITUDE
                    ],

                zoom:
                    INITIAL_ZOOM,

                minZoom:
                    0,

                maxZoom:
                    13,

                bearing:
                    0,

                pitch:
                    0,

                maxPitch:
                    0,

                attributionControl:
                    true

            });


        /*
         * =========================================================
         * CONTRÔLES
         * =========================================================
         */


        map.addControl(
            new maplibregl.NavigationControl(),
            "top-right"
        );


        /*
         * =========================================================
         * DÉSACTIVATION DE LA ROTATION
         * =========================================================
         *
         * Carte strictement 2D.
         *
         */


        map.dragRotate.disable();


        map.touchZoomRotate.disableRotation();


        map.keyboard.disable();


        /*
         * =========================================================
         * TUILES ACTUELLEMENT CHARGÉES
         * =========================================================
         *
         * Map :
         *
         * "tileX/tileY" → informations sur la tuile.
         *
         */


        const loadedTiles =
            new Map();


        /*
         * =========================================================
         * TUILES DEMANDÉES POUR LA VUE ACTUELLE
         * =========================================================
         */


        let desiredTiles =
            new Set();


        /*
         * =========================================================
         * IDENTIFIANT TUILE
         * =========================================================
         */


        function tileId(
            tileX,
            tileY
        ) {

            return (
                tileX +
                "/" +
                tileY
            );

        }


        /*
         * =========================================================
         * CRÉATION D'UNE TUILE WPLACE
         * =========================================================
         */


        function addWPlaceTile(
            tileX,
            tileY
        ) {


            const id =
                tileId(
                    tileX,
                    tileY
                );


            /*
             * Déjà présente.
             */


            if (
                loadedTiles.has(id)
            ) {

                return;

            }


            /*
             * Protection.
             */


            if (
                loadedTiles.size >=
                MAX_LOADED_TILES
            ) {

                console.warn(
                    "Limite de tuiles atteinte."
                );

                return;

            }


            const sourceId =
                "wplace-" +
                tileX +
                "-" +
                tileY;


            const layerId =
                sourceId +
                "-layer";


            const url =
                WPLACE_PROXY +
                "/tile/" +
                tileX +
                "/" +
                tileY +
                ".png";


            const coordinates =
                getTileCoordinates(
                    tileX,
                    tileY
                );


            /*
             * Source image MapLibre.
             */


            map.addSource(

                sourceId,

                {

                    type:
                        "image",

                    url:
                        url,

                    coordinates:
                        coordinates

                }

            );


            /*
             * Couche raster.
             */


            map.addLayer({

                id:
                    layerId,

                type:
                    "raster",

                source:
                    sourceId,

                minzoom:
                    WPLACE_MIN_DISPLAY_ZOOM,

                maxzoom:
                    14,

                paint:
                    {

                        "raster-opacity":
                            1,

                        "raster-fade-duration":
                            0

                    }

            });


            loadedTiles.set(

                id,

                {

                    tileX,
                    tileY,

                    sourceId,
                    layerId

                }

            );


            console.log(
                "Tuile WPlace chargée :",
                tileX,
                tileY
            );


        }


        /*
         * =========================================================
         * SUPPRESSION D'UNE TUILE
         * =========================================================
         */


        function removeWPlaceTile(
            id
        ) {


            const tile =
                loadedTiles.get(id);


            if (
                !tile
            ) {

                return;

            }


            /*
             * Supprimer la couche.
             */


            if (
                map.getLayer(
                    tile.layerId
                )
            ) {

                map.removeLayer(
                    tile.layerId
                );

            }


            /*
             * Supprimer la source.
             */


            if (
                map.getSource(
                    tile.sourceId
                )
            ) {

                map.removeSource(
                    tile.sourceId
                );

            }


            loadedTiles.delete(
                id
            );


            console.log(
                "Tuile WPlace retirée :",
                tile.tileX,
                tile.tileY
            );

        }


        /*
         * =========================================================
         * CALCUL DES TUILES VISIBLES
         * =========================================================
         */


        function getVisibleWPlaceTiles() {


            const zoom =
                map.getZoom();


            /*
             * Pas de pixels sous le seuil.
             */


            if (
                zoom <
                WPLACE_MIN_DISPLAY_ZOOM
            ) {

                return new Set();

            }


            const bounds =
                map.getBounds();


            /*
             * Bornes géographiques.
             */


            let west =
                bounds.getWest();


            let east =
                bounds.getEast();


            let north =
                bounds.getNorth();


            let south =
                bounds.getSouth();


            /*
             * Empêcher les coordonnées hors Web Mercator.
             */


            north =
                Math.min(
                    85.05112878,
                    north
                );


            south =
                Math.max(
                    -85.05112878,
                    south
                );


            /*
             * Cas normal.
             */


            const worldWest =
                longitudeToWorldX(
                    west
                );


            const worldEast =
                longitudeToWorldX(
                    east
                );


            const worldNorth =
                latitudeToWorldY(
                    north
                );


            const worldSouth =
                latitudeToWorldY(
                    south
                );


            let minTileX =
                Math.floor(
                    worldWest /
                    WPLACE_TILE_SIZE
                );


            let maxTileX =
                Math.floor(
                    worldEast /
                    WPLACE_TILE_SIZE
                );


            let minTileY =
                Math.floor(
                    worldNorth /
                    WPLACE_TILE_SIZE
                );


            let maxTileY =
                Math.floor(
                    worldSouth /
                    WPLACE_TILE_SIZE
                );


            /*
             * Marge.
             */


            minTileX -=
                TILE_PADDING;


            maxTileX +=
                TILE_PADDING;


            minTileY -=
                TILE_PADDING;


            maxTileY +=
                TILE_PADDING;


            /*
             * Limites.
             */


            minTileX =
                Math.max(
                    0,
                    minTileX
                );


            minTileY =
                Math.max(
                    0,
                    minTileY
                );


            maxTileX =
                Math.min(
                    WPLACE_TILE_COUNT - 1,
                    maxTileX
                );


            maxTileY =
                Math.min(
                    WPLACE_TILE_COUNT - 1,
                    maxTileY
                );


            /*
             * Construire l'ensemble.
             */


            const result =
                new Set();


            for (
                let x =
                    minTileX;

                x <=
                    maxTileX;

                x++
            ) {


                for (
                    let y =
                        minTileY;

                    y <=
                        maxTileY;

                    y++
                ) {


                    result.add(
                        tileId(
                            x,
                            y
                        )
                    );

                }

            }


            return result;

        }


        /*
         * =========================================================
         * MISE À JOUR DES TUILES
         * =========================================================
         */


        function updateWPlaceTiles() {


            const zoom =
                map.getZoom();


            /*
             * Sous le niveau 9 :
             *
             * tout retirer.
             */


            if (
                zoom <
                WPLACE_MIN_DISPLAY_ZOOM
            ) {


                desiredTiles =
                    new Set();


                for (
                    const id
                    of loadedTiles.keys()
                ) {

                    removeWPlaceTile(
                        id
                    );

                }


                updateTileCounters();


                document
                    .getElementById(
                        "status"
                    )
                    .textContent =
                    "Carte géographique — zoom " +
                    zoom.toFixed(1);


                return;

            }


            /*
             * Calcul des tuiles voulues.
             */


            desiredTiles =
                getVisibleWPlaceTiles();


            /*
             * Sécurité :
             *
             * si la zone visible demande plus de 100 tuiles,
             * on n'essaie pas de tout charger.
             */


            if (
                desiredTiles.size >
                MAX_LOADED_TILES
            ) {

                console.warn(
                    "La vue demande",
                    desiredTiles.size,
                    "tuiles."
                );


                document
                    .getElementById(
                        "status"
                    )
                    .textContent =
                    "Zone trop large — zoomez davantage";


                return;

            }


            /*
             * Charger les nouvelles tuiles.
             */


            for (
                const id
                of desiredTiles
            ) {


                if (
                    loadedTiles.has(id)
                ) {

                    continue;

                }


                const parts =
                    id.split(
                        "/"
                    );


                const tileX =
                    Number(
                        parts[0]
                    );


                const tileY =
                    Number(
                        parts[1]
                    );


                addWPlaceTile(
                    tileX,
                    tileY
                );

            }


            /*
             * Retirer les tuiles qui ne sont plus nécessaires.
             */


            for (
                const id
                of loadedTiles.keys()
            ) {


                if (
                    !desiredTiles.has(id)
                ) {

                    removeWPlaceTile(
                        id
                    );

                }

            }


            /*
             * Statut.
             */


            document
                .getElementById(
                    "status"
                )
                .textContent =
                "Pixels WPlace actifs — zoom " +
                zoom.toFixed(1);


            updateTileCounters();

        }


        /*
         * =========================================================
         * COMPTEURS
         * =========================================================
         */


        function updateTileCounters() {


            document
                .getElementById(
                    "visibleTiles"
                )
                .textContent =
                desiredTiles.size;


            document
                .getElementById(
                    "loadedTiles"
                )
                .textContent =
                loadedTiles.size;

        }


        /*
         * =========================================================
         * INTERFACE
         * =========================================================
         */


        function updateInterface() {


            const zoom =
                map.getZoom();


            document
                .getElementById(
                    "zoom"
                )
                .textContent =
                zoom.toFixed(2);


            const center =
                map.getCenter();


            const worldX =
                longitudeToWorldX(
                    center.lng
                );


            const worldY =
                latitudeToWorldY(
                    center.lat
                );


            const wplace =
                worldToWplace(
                    worldX,
                    worldY
                );


            document
                .getElementById(
                    "tile"
                )
                .textContent =
                wplace.tileX +
                " / " +
                wplace.tileY;


            document
                .getElementById(
                    "pixel"
                )
                .textContent =
                wplace.pixelX +
                " / " +
                wplace.pixelY;


            updateTileCounters();

        }


        /*
         * =========================================================
         * SOURIS
         * =========================================================
         */


        map.on(

            "mousemove",

            function (
                event
            ) {


                const worldX =
                    longitudeToWorldX(
                        event.lngLat.lng
                    );


                const worldY =
                    latitudeToWorldY(
                        event.lngLat.lat
                    );


                const wplace =
                    worldToWplace(
                        worldX,
                        worldY
                    );


                document
                    .getElementById(
                        "coordinates"
                    )
                    .textContent =

                    "Tuile " +
                    wplace.tileX +
                    " / " +
                    wplace.tileY +

                    "   Pixel " +
                    wplace.pixelX +
                    " / " +
                    wplace.pixelY;

            }

        );


        /*
         * =========================================================
         * DÉPLACEMENT TERMINÉ
         * =========================================================
         */


        map.on(

            "moveend",

            function () {

                updateInterface();

                updateWPlaceTiles();

            }

        );


        /*
         * =========================================================
         * ZOOM TERMINÉ
         * =========================================================
         */


        map.on(

            "zoomend",

            function () {

                updateInterface();

                updateWPlaceTiles();

            }

        );


        /*
         * =========================================================
         * CHARGEMENT DE LA CARTE
         * =========================================================
         */


        map.on(

            "load",

            function () {


                console.log(
                    "========================================"
                );


                console.log(
                    "WPlace Bergamottto"
                );


                console.log(
                    "Carte géographique chargée"
                );


                console.log(
                    "Monde WPlace :",
                    WPLACE_WORLD_SIZE,
                    "×",
                    WPLACE_WORLD_SIZE
                );


                console.log(
                    "Zoom natif :",
                    WPLACE_NATIVE_ZOOM
                );


                console.log(
                    "Proxy :",
                    WPLACE_PROXY
                );


                console.log(
                    "Affichage WPlace à partir du zoom :",
                    WPLACE_MIN_DISPLAY_ZOOM
                );


                console.log(
                    "Limite simultanée :",
                    MAX_LOADED_TILES,
                    "tuiles"
                );


                console.log(
                    "========================================"
                );


                /*
                 * Forcer la carte en 2D.
                 */


                map.setBearing(
                    0
                );


                map.setPitch(
                    0
                );


                /*
                 * Première mise à jour.
                 */


                updateInterface();


                updateWPlaceTiles();


            }

        );


        /*
         * =========================================================
         * ERREURS MAPLIBRE
         * =========================================================
         */


        map.on(

            "error",

            function (
                event
            ) {

                console.error(
                    "Erreur MapLibre :",
                    event
                );

            }

        );


    </script>
