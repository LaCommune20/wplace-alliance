<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Administration — Éditeur de zone</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0b0b0b;color:#eee;font-family:Arial,Helvetica,sans-serif}body{padding:24px}.wrap{max-width:900px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:18px}.top h1{margin:0;font-size:19px}.sub{margin-top:4px;color:#777;font-size:10px}.actions{display:flex;gap:7px}.btn{border:1px solid rgba(255,255,255,.1);border-radius:9px;background:#1b1b1b;color:#aaa;padding:8px 11px;cursor:pointer;font-size:10px;text-decoration:none}.btn:hover{background:#292929;color:#fff}.btn.primary{border-color:rgba(225,6,0,.55);background:#b90500;color:#fff}.panel{padding:18px;border:1px solid rgba(255,255,255,.09);border-radius:14px;background:#121212}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{color:#777;font-size:9px;text-transform:uppercase;letter-spacing:.75px}.field input,.field select,.field textarea{width:100%;border:1px solid rgba(255,255,255,.11);border-radius:9px;background:#181818;color:#fff;padding:10px;font:11px Arial,Helvetica,sans-serif;outline:none}.field textarea{min-height:110px;resize:vertical;line-height:1.45}.field input:focus,.field select:focus,.field textarea:focus{border-color:rgba(225,6,0,.55)}.check{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid rgba(255,255,255,.08);border-radius:9px;background:rgba(255,255,255,.025);color:#aaa;font-size:10px}.check input{accent-color:#e10600}.readonly{opacity:.6}.bottom{display:flex;align-items:center;gap:10px;margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.07)}#state{flex:1;color:#777;font-size:10px}#state.ok{color:#9dcea0}#state.err{color:#e99}.hidden{display:none!important}.list{display:grid;gap:7px;margin-top:10px}.zone{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid rgba(255,255,255,.07);border-radius:9px;background:#151515}.zone strong{font-size:11px}.zone small{display:block;margin-top:3px;color:#777;font:9px Consolas,monospace}.zone button{border:1px solid rgba(225,6,0,.3);border-radius:7px;background:rgba(225,6,0,.06);color:#ddd;padding:6px 9px;font-size:9px;cursor:pointer}.zone button:hover{background:rgba(225,6,0,.16);color:#fff}@media(max-width:650px){body{padding:14px}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.top{align-items:flex-start}.actions{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div><h1>Éditeur de zone</h1><div class="sub">Administration — WPlace La Commune</div></div><div class="actions"><a class="btn" href="./">← Administration</a><a class="btn" href="../">← Carte</a></div></header>
<div id="gate" class="panel"><div id="gate-state">Vérification de votre accès…</div></div>
<div id="app" class="hidden">
<div class="panel"><div style="color:#aaa;font-size:10px;text-transform:uppercase;letter-spacing:.8px">Sélectionner une zone</div><div id="zone-list" class="list">Chargement…</div></div>
<div id="editor" class="panel hidden" style="margin-top:14px"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:15px"><div><div id="title" style="font-size:15px;font-weight:bold">Zone</div><div id="subtitle" class="sub">—</div></div><a id="geometry" class="btn" href="#">Géométrie</a></div>
<form id="form" class="grid">
<div class="field full"><label>Nom</label><input id="name" required maxlength="120"></div>
<div class="field"><label>Slug</label><input id="slug" required maxlength="80" pattern="[a-z0-9]+(?:-[a-z0-9]+)*"></div>
<div class="field"><label>Catégorie</label><select id="category"><option value="commune">La Commune</option><option value="allie">Allié</option><option value="neutre">Neutre</option></select></div>
<div class="field full"><label>Description</label><textarea id="description" maxlength="1000"></textarea></div>
<div class="field"><label>Continent</label><input id="continent" required maxlength="80"></div>
<div class="field"><label>Pays</label><input id="country" required maxlength="80"></div>
<div class="field"><label>Responsable</label><input id="owner" maxlength="120"></div>
<label class="check"><input id="ownerPublic" type="checkbox"> Afficher le responsable publiquement</label>
<div class="field"><label>Statut</label><select id="status"><option value="active">Active</option><option value="archived">Archivée</option></select></div>
<div class="field"><label>Version actuelle</label><input id="version" class="readonly" readonly></div>
<div class="field"><label>Centre — longitude</label><input id="lon" type="number" step="any" min="-180" max="180"></div>
<div class="field"><label>Centre — latitude</label><input id="lat" type="number" step="any" min="-90" max="90"></div>
<div class="field"><label>Zoom initial</label><input id="zoom" type="number" step="0.1" min="0" max="24"></div>
<div class="bottom full"><div id="state"></div><button class="btn" type="button" id="cancel">Annuler</button><button class="btn primary" type="submit" id="save">Enregistrer</button></div>
</form></div></div>
<script>
const API="https://wplace-commune-api-dev.mathieu-peter.workers.dev";
let zones=[];let current=null;
function auth(extra={}){const t=sessionStorage.getItem("wplace_session");return t?{...extra,headers:{...(extra.headers||{}),Authorization:"Bearer "+t},cache:"no-store"}:{...extra,credentials:"include",cache:"no-store"}}
async function get(path){const r=await fetch(API+path,auth());const d=await r.json().catch(()=>null);if(!r.ok)throw new Error(d?.error||"HTTP "+r.status);return d}
function center(v){if(!v)return{};if(typeof v==='string'){try{v=JSON.parse(v)}catch{return{}}}if(Array.isArray(v))return{lon:v[0],lat:v[1]};return{lon:v.longitude??v.lng,lat:v.latitude??v.lat}}
function cat(v){v=String(v||'');if(v==='commune')return'La Commune';if(['allie','sympathisant','allie-neutre'].includes(v))return'Allié';if(v==='neutre')return'Neutre';return v||'—'}
async function load(){try{const me=await get('/api/auth/me');if(!me.authenticated||!['admin','moderator'].includes(me.access))throw new Error('Accès réservé aux administrateurs et modérateurs.');zones=await get('/api/admin/zones');if(!Array.isArray(zones))zones=zones?.zones||[];document.getElementById('gate').classList.add('hidden');document.getElementById('app').classList.remove('hidden');renderList();const requested=new URL(window.location.href).searchParams.get('zone');if(requested){const match=zones.find(z=>String(z.id)===String(requested)||String(z.slug)===String(requested));if(match)open(match.id)}}catch(e){document.getElementById('gate-state').textContent=e.message}}
function renderList(){const el=document.getElementById('zone-list');el.innerHTML='';if(!zones.length){el.textContent='Aucune zone accessible.';return}zones.forEach(z=>{const row=document.createElement('div');row.className='zone';const info=document.createElement('div');const n=document.createElement('strong');n.textContent=z.name||z.slug||('Zone '+z.id);const m=document.createElement('small');m.textContent=(z.slug||z.id)+' · v'+(z.version??'—')+' · '+cat(z.category_slug||z.category_name);info.append(n,m);const b=document.createElement('button');b.type='button';b.textContent='Modifier';b.onclick=()=>open(z.id);row.append(info,b);el.appendChild(row)})}
async function open(id){try{const d=await get('/api/admin/zones/'+encodeURIComponent(id));current=d?.zone||d;fill(current);document.getElementById('editor').classList.remove('hidden');document.getElementById('editor').scrollIntoView({behavior:'smooth',block:'start'})}catch(e){alert('Impossible de charger la zone : '+e.message)}}
function fill(z){const c=center(z.center);document.getElementById('title').textContent=z.name||'Zone';document.getElementById('subtitle').textContent=(z.slug||z.id)+' · v'+(z.version??'—');document.getElementById('name').value=z.name||'';document.getElementById('slug').value=z.slug||'';document.getElementById('description').value=z.description||'';document.getElementById('continent').value=z.continent||'';document.getElementById('country').value=z.country||'';document.getElementById('owner').value=z.owner_name||'';document.getElementById('ownerPublic').checked=z.owner_public!==0&&z.owner_public!==false;document.getElementById('status').value=z.status||'active';document.getElementById('version').value=z.version??'—';document.getElementById('lon').value=c.lon??'';document.getElementById('lat').value=c.lat??'';document.getElementById('zoom').value=z.focus_zoom??'';document.getElementById('category').value=['allie','sympathisant','allie-neutre'].includes(z.category_slug)?'allie':(z.category_slug||'neutre');document.getElementById('geometry').href='geometry.html?zone='+encodeURIComponent(z.id)}
document.getElementById('cancel').onclick=()=>document.getElementById('editor').classList.add('hidden');
document.getElementById('form').onsubmit=async e=>{e.preventDefault();if(!current)return;const state=document.getElementById('state');state.className='';state.textContent='Enregistrement…';const body={name:document.getElementById('name').value.trim(),slug:document.getElementById('slug').value.trim(),description:document.getElementById('description').value.trim(),category_slug:document.getElementById('category').value,continent:document.getElementById('continent').value.trim(),country:document.getElementById('country').value.trim(),owner_name:document.getElementById('owner').value.trim()||null,owner_public:document.getElementById('ownerPublic').checked,status:document.getElementById('status').value,center:{longitude:Number(document.getElementById('lon').value),latitude:Number(document.getElementById('lat').value)},focus_zoom:Number(document.getElementById('zoom').value)};if(!Number.isFinite(body.center.longitude)||!Number.isFinite(body.center.latitude)||!Number.isFinite(body.focus_zoom)){state.className='err';state.textContent='Centre et zoom doivent être renseignés.';return}try{let r=await fetch(API+'/api/admin/zones/'+encodeURIComponent(current.id),auth({method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}));if(r.status===405)r=await fetch(API+'/api/admin/zones/'+encodeURIComponent(current.id),auth({method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}));const d=await r.json().catch(()=>null);if(!r.ok)throw new Error(d?.error||'HTTP '+r.status);state.className='ok';state.textContent='Zone enregistrée.';setTimeout(()=>{load();document.getElementById('editor').classList.add('hidden')},550)}catch(err){state.className='err';state.textContent='Échec : '+err.message}};
load();
</script>
</body>
</html>
