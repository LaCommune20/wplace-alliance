<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Éditeur géométrique — WPlace La Commune</title>
<link href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>
<style>
*{box-sizing:border-box}html,body,#map{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Arial,Helvetica,sans-serif}
#bar{position:fixed;top:10px;left:10px;right:10px;z-index:20;display:flex;align-items:center;gap:8px;padding:9px 11px;border:1px solid rgba(255,255,255,.12);border-radius:13px;background:rgba(12,12,12,.94);box-shadow:0 8px 30px rgba(0,0,0,.45);color:#fff}
#title{font-size:13px;font-weight:700}.sub{font-size:9px;color:#777;margin-top:2px}.grow{flex:1}
button,select{border:1px solid rgba(255,255,255,.12);border-radius:9px;background:#1a1a1a;color:#ccc;padding:7px 9px;font-size:10px;cursor:pointer}button:hover,select:hover{background:#252525;color:#fff}.primary{background:#b90500;border-color:rgba(225,6,0,.65);color:#fff}.primary:hover{background:#e10600}.danger{color:#ffb0ac;border-color:rgba(225,6,0,.3)}
#tools{position:fixed;left:10px;top:76px;z-index:20;width:235px;padding:11px;border:1px solid rgba(255,255,255,.12);border-radius:13px;background:rgba(12,12,12,.94);box-shadow:0 8px 30px rgba(0,0,0,.4);color:#ddd}
#tools h3{margin:0 0 8px;font-size:11px}.hint{color:#777;font-size:9px;line-height:1.45}.row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.row button{flex:1}.stat{margin-top:9px;padding-top:8px;border-top:1px solid rgba(255,255,255,.08);font:9px Consolas,monospace;color:#888}.stat strong{color:#ddd}
#state{margin-top:8px;min-height:16px;font-size:9px}.ok{color:#9dcea0!important}.err{color:#f0a0a0!important}
.vertex{width:14px;height:14px;border-radius:50%;background:#e10600;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.6);cursor:grab}.vertex.selected{width:18px;height:18px;background:#fff;border:3px solid #e10600}.center-marker{width:18px;height:18px;border-radius:50%;border:2px solid #fff;background:#090909;box-shadow:0 2px 8px rgba(0,0,0,.7);cursor:grab;position:relative}.center-marker:after{content:"";position:absolute;left:50%;top:50%;width:5px;height:5px;border-radius:50%;background:#e10600;transform:translate(-50%,-50%)}
#auth{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:#0b0b0b;color:#fff}.authbox{width:min(420px,calc(100% - 30px));padding:24px;border:1px solid rgba(255,255,255,.12);border-radius:15px;background:#121212;text-align:center}.authbox h2{margin:0;font-size:17px}.authbox p{color:#888;font-size:11px;line-height:1.5}.hidden{display:none!important}
.maplibregl-ctrl-group{background:rgba(15,15,15,.9)!important}.maplibregl-ctrl-group button{filter:invert(1)}.maplibregl-ctrl-attrib{background:rgba(0,0,0,.65)!important;color:#aaa}.maplibregl-ctrl-attrib a{color:#ddd}
@media(max-width:700px){#bar{flex-wrap:wrap}.grow{display:none}#tools{width:min(235px,calc(100vw - 20px));top:116px}}
</style>
</head>
<body>
<div id="auth"><div class="authbox"><h2 id="auth-title">Vérification de l'accès…</h2><p id="auth-msg">Vérification de votre session Discord.</p></div></div>
<div id="map"></div>
<div id="bar"><div><div id="title">Éditeur géométrique</div><div class="sub" id="zone-sub">Chargement…</div></div><div class="grow"></div><select id="zone-select" aria-label="Zone"></select><button id="back">← Administration</button></div>
<div id="tools"><h3>Géométrie</h3><div class="hint">Déplace les sommets rouges. Active « Ajouter » puis clique sur un segment pour créer un sommet. Sélectionne un sommet pour le supprimer.</div><div class="row"><button id="add">＋ Ajouter</button><button id="delete" class="danger">− Supprimer</button></div><div class="row"><button id="reset">Réinitialiser</button><button id="center">Centrer</button></div><div class="stat">Sommets : <strong id="count">—</strong><br>Centre : <strong id="center-read">—</strong></div><div id="state"></div><div class="row"><button id="cancel">Annuler</button><button id="save" class="primary">Enregistrer</button></div></div>
<script>
const API="https://wplace-commune-api-dev.mathieu-peter.workers.dev";
let map=null,zones=[],zone=null,originalPoints=[],points=[],originalCenter=null,center=null,markers=[],centerMarker=null,selected=-1,adding=false;
function auth(){const t=sessionStorage.getItem("wplace_session");return t?{headers:{Authorization:"Bearer "+t},cache:"no-store"}:{credentials:"include",cache:"no-store"}}
async function get(path){const r=await fetch(API+path,auth());let d=null;try{d=await r.json()}catch{}if(!r.ok)throw new Error(d?.error||"HTTP "+r.status);return d}
function parseJson(v){if(typeof v!=="string")return v;try{return JSON.parse(v)}catch{return null}}
function parseCenter(v){const c=parseJson(v)||{};if(Array.isArray(c))return{lng:Number(c[0]),lat:Number(c[1])};return{lng:Number(c.longitude??c.lng),lat:Number(c.latitude??c.lat)}}
function geoPoints(){return points.map(p=>[Number(p[1]),Number(p[0])])}
function setState(text,kind=""){const e=document.getElementById("state");e.className=kind;e.textContent=text}
function updateSource(){if(!map||!map.getSource("edit-zone")||points.length<3)return;const c=geoPoints();map.getSource("edit-zone").setData({type:"Feature",properties:{},geometry:{type:"Polygon",coordinates:[[...c,c[0]]]}});document.getElementById("count").textContent=points.length}
function renderMarkers(){markers.forEach(m=>m.remove());markers=[];points.forEach((p,i)=>{const el=document.createElement("div");el.className="vertex"+(i===selected?" selected":"");el.title="Sommet "+(i+1);const m=new maplibregl.Marker({element:el,draggable:true}).setLngLat([p[1],p[0]]).addTo(map);m.on("drag",()=>{const c=m.getLngLat();points[i]=[c.lat,c.lng];updateSource()});m.on("click",e=>{e.originalEvent.stopPropagation();selected=i;renderMarkers();setState("Sommet "+(i+1)+" sélectionné.")});markers.push(m)})}
function render(){if(!map||!zone)return;document.getElementById("count").textContent=points.length;document.getElementById("center-read").textContent=center.lng.toFixed(5)+" / "+center.lat.toFixed(5);const c=geoPoints();const data={type:"Feature",properties:{},geometry:{type:"Polygon",coordinates:[[...c,c[0]]]}};const src=map.getSource("edit-zone");if(src)src.setData(data);else{map.addSource("edit-zone",{type:"geojson",data});map.addLayer({id:"edit-fill",type:"fill",source:"edit-zone",paint:{"fill-color":zone.category_color||"#e10600","fill-opacity":.16}});map.addLayer({id:"edit-line",type:"line",source:"edit-zone",paint:{"line-color":"#e10600","line-width":3,"line-dasharray":[2,1]}})}renderMarkers();if(centerMarker)centerMarker.remove();const ce=document.createElement("div");ce.className="center-marker";ce.title="Centre de la zone";centerMarker=new maplibregl.Marker({element:ce,draggable:true}).setLngLat([center.lng,center.lat]).addTo(map);centerMarker.on("drag",()=>{const c=centerMarker.getLngLat();center={lng:c.lng,lat:c.lat};document.getElementById("center-read").textContent=center.lng.toFixed(5)+" / "+center.lat.toFixed(5)});if(c.length>=3){const bounds=c.reduce((b,p)=>b.extend(p),new maplibregl.LngLatBounds(c[0],c[0]));map.fitBounds(bounds,{padding:{top:130,bottom:80,left:270,right:40},maxZoom:12,duration:500})}}
function loadZone(z){zone=z;points=JSON.parse(z.polygon).map(p=>[Number(p[0]),Number(p[1])]);originalPoints=points.map(p=>[...p]);center=parseCenter(z.center);originalCenter={...center};selected=-1;adding=false;document.getElementById("add").classList.remove("primary");document.getElementById("zone-sub").textContent=z.name+" · "+z.slug+" · v"+z.version;render();setState("Prêt.")}
function reset(){if(!zone)return;points=originalPoints.map(p=>[...p]);center={...originalCenter};selected=-1;render();setState("Modifications annulées.")}
function removeSelected(){if(selected<0)return setState("Sélectionne d'abord un sommet.","err");if(points.length<=3)return setState("Une zone doit conserver au moins 3 sommets.","err");points.splice(selected,1);selected=-1;render();setState("Sommet supprimé.")}
function distancePointSegment(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1];if(dx===0&&dy===0)return Math.hypot(p[0]-a[0],p[1]-a[1]);const t=Math.max(0,Math.min(1,((p[0]-a[0])*dx+(p[1]-a[1])*dy)/(dx*dx+dy*dy)));return Math.hypot(p[0]-(a[0]+t*dx),p[1]-(a[1]+t*dy))}
function addAt(lngLat){if(!adding)return;const q=map.project(lngLat);let best=-1,bestDist=Infinity;for(let i=0;i<points.length;i++){const a=map.project({lng:points[i][1],lat:points[i][0]}),b=map.project({lng:points[(i+1)%points.length][1],lat:points[(i+1)%points.length][0]});const d=distancePointSegment([q.x,q.y],[a.x,a.y],[b.x,b.y]);if(d<bestDist){bestDist=d;best=i}}if(best<0||bestDist>28)return setState("Clique près d'un segment pour ajouter un sommet.","err");points.splice(best+1,0,[lngLat.lat,lngLat.lng]);selected=best+1;adding=false;document.getElementById("add").classList.remove("primary");render();setState("Sommet ajouté.")}
function validate(){if(points.length<3)throw new Error("Au moins 3 sommets sont nécessaires.");const keys=new Set();for(const p of points){if(!Number.isFinite(p[0])||!Number.isFinite(p[1])||p[0]<-90||p[0]>90||p[1]<-180||p[1]>180)throw new Error("Coordonnée invalide.");const k=p.join(",");if(keys.has(k))throw new Error("Le polygone contient des sommets dupliqués.");keys.add(k)}}
async function save(){try{validate();setState("Enregistrement…");const r=await fetch(API+"/api/admin/zones/"+encodeURIComponent(zone.id),auth({method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({polygon:points,center:{longitude:center.lng,latitude:center.lat}})}));let d=null;try{d=await r.json()}catch{}if(!r.ok)throw new Error(d?.error||"HTTP "+r.status);zone={...zone,version:d?.zone?.version??zone.version+1,polygon:JSON.stringify(points),center:{longitude:center.lng,latitude:center.lat}};originalPoints=points.map(p=>[...p]);originalCenter={...center};setState("Zone enregistrée.","ok")}catch(e){console.error(e);setState("Échec : "+e.message,"err")}}
async function selectZone(id){const d=await get("/api/admin/zones/"+encodeURIComponent(id));loadZone(d?.zone||d)}
async function init(){try{const me=await get("/api/auth/me");if(me?.access!=="admin")throw new Error("Accès réservé aux administrateurs.");zones=await get("/api/admin/zones");if(!Array.isArray(zones)||!zones.length)throw new Error("Aucune zone accessible.");const select=document.getElementById("zone-select");select.innerHTML=zones.map(z=>`<option value="${esc(z.id)}">${esc(z.name)}</option>`).join("");const wanted=new URLSearchParams(location.search).get("zone");const initial=zones.find(z=>String(z.id)===wanted||z.slug===wanted)||zones[0];select.value=String(initial.id);map=new maplibregl.Map({container:"map",style:"https://tiles.openfreemap.org/styles/liberty",center:[5.93,43.12],zoom:6,minZoom:0,maxZoom:13});map.addControl(new maplibregl.NavigationControl(),"top-right");map.dragRotate.disable();map.on("load",()=>selectZone(initial.id));select.onchange=()=>selectZone(select.value);map.on("click",e=>addAt(e.lngLat));document.getElementById("add").onclick=()=>{adding=!adding;document.getElementById("add").classList.toggle("primary",adding);setState(adding?"Mode ajout : clique sur un segment.":"Mode ajout désactivé.")};document.getElementById("delete").onclick=removeSelected;document.getElementById("reset").onclick=reset;document.getElementById("save").onclick=save;document.getElementById("cancel").onclick=()=>{reset();location.href="index.html"};document.getElementById("center").onclick=()=>map.flyTo({center:[center.lng,center.lat],zoom:Math.max(map.getZoom(),9),duration:500});document.getElementById("back").onclick=()=>location.href="index.html"}catch(e){console.error(e);document.getElementById("auth-title").textContent="Accès refusé";document.getElementById("auth-msg").textContent=e.message}}
init();
</script>
</body>
</html>
