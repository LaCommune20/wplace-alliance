name: Apply admin zone editor

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'chore: apply admin zone editor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Inject admin zone editor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('commune/index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="admin-zones.js"></script>'
          if tag not in s:
              marker = '</body>'
              if marker not in s:
                  raise SystemExit('Cannot find </body> in commune/index.html')
              s = s.replace(marker, tag + '\n' + marker, 1)
              p.write_text(s, encoding='utf-8')
          PY

          git config user.name 'LaCommune20'
          git config user.email 'mathieu.peter@live.fr'
          git add commune/index.html
          git diff --cached --quiet || git commit -m 'chore: apply admin zone editor'
          git push

      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/apply-admin-zones-ui.yml || true
          git config user.name 'LaCommune20'
          git config user.email 'mathieu.peter@live.fr'
          git diff --cached --quiet || git commit -m 'chore: remove temporary admin editor workflow'
          git push || true
