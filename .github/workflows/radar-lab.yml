name: Radar Lab

on:
  pull_request:
    paths:
      - "radar/**"
      - "migrations/*.sql"
      - ".github/workflows/radar-lab.yml"
  push:
    branches:
      - feat/radar-lab
      - feat/radar-live-source-final5
      - feat/radar-baseline-store
    paths:
      - "radar/**"
      - "migrations/*.sql"
      - ".github/workflows/radar-lab.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: radar

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Radar Lab tests
        run: |
          node test-png-decoder.mjs
          node test-scan-core.mjs
          node test-tile-geometry.mjs
          node test-scan-planner.mjs
          node test-baseline-store.mjs
          node event-resolver.test.mjs
          node event-region-groups.test.mjs
          node radar-scope.test.mjs
          node test-radar-config.sql.mjs
          node test-scan-runner.mjs
          node test-wplace-source.mjs
