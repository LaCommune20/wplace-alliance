name: Inject geometry editor
on:
  workflow_dispatch:
  push:
    paths:
      - 'commune/admin-geometry-link.js'
      - 'commune/geometry.html'
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('commune/index.html')
          s=p.read_text()
          tag='<script src="admin-geometry-link.js"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>')
              p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add commune/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(admin): expose zone geometry editor'
          git push
