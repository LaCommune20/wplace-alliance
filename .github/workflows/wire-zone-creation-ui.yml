name: Wire zone creation UI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch admin zone creation UI
        shell: python
        run: |
          from pathlib import Path

          index = Path("commune/index.html")
          text = index.read_text(encoding="utf-8")
          marker = 'id="new-zone-button"'
          if marker not in text:
              old = '<section id="zones" class="section"><h2>Zones</h2><p>Zones accessibles selon votre niveau d\'administration.</p><div class="panel"><div id="zones-list" class="empty">Chargement…</div></div></section>'
              new = '<section id="zones" class="section"><div class="section-head"><div><h2>Zones</h2><p>Zones accessibles selon votre niveau d\'administration.</p></div><button class="refresh" id="new-zone-button" type="button">+ Nouvelle zone</button></div><div class="panel"><div id="zones-list" class="empty">Chargement…</div></div></section>'
              if old not in text:
                  raise SystemExit("Bloc Zones introuvable dans commune/index.html")
              text = text.replace(old, new, 1)

              hook = 'document.getElementById("new-zone-button").onclick=()=>{window.location.href="zone-create.html"};'
              text = text.replace('</script>\n</body>', hook + '</script>\n</body>', 1)
              index.write_text(text, encoding="utf-8")

          create = Path("commune/zone-create.html")
          c = create.read_text(encoding="utf-8")
          c = c.replace('<option value="allie">Allié</option><option value="neutre">Neutre</option>', '<option value="sympathisant">Allié</option><option value="allie-neutre">Neutre</option>')

          old_render = 'function render(){if(!map)return;document.getElementById("count").textContent=points.length;const c=geoPoints();const data={type:"Feature",properties:{},geometry:{type:"Polygon",coordinates:[[...c,...(c.length? [c[0]]:[])]]}};const src=map.getSource("new-zone");if(src)src.setData(data);else{map.addSource("new-zone",{type:"geojson",data});map.addLayer({id:"new-fill",type:"fill",source:"new-zone",paint:{"fill-color":"#e10600","fill-opacity":.12}});map.addLayer({id:"new-line",type:"line",source:"new-zone",paint:{"line-color":"#e10600","line-width":3,"line-dasharray":[2,1]}})}renderMarkers();if(centerMarker)centerMarker.remove();if(center){const ce=document.createElement("div");ce.className="center-marker";ce.title="Centre de la zone";centerMarker=new maplibregl.Marker({element:ce,draggable:true}).setLngLat([center.lng,center.lat]).addTo(map);centerMarker.on("drag",()=>{const c=centerMarker.getLngLat();center={lng:c.lng,lat:c.lat};updateCenterRead()})}updateCenterRead()}'
          new_render = 'function render(){if(!map)return;document.getElementById("count").textContent=points.length;const c=geoPoints();const data=c.length>=3?{type:"Feature",properties:{},geometry:{type:"Polygon",coordinates:[[...c,c[0]]]}}:{type:"FeatureCollection",features:[]};const src=map.getSource("new-zone");if(src)src.setData(data);else{map.addSource("new-zone",{type:"geojson",data});map.addLayer({id:"new-fill",type:"fill",source:"new-zone",paint:{"fill-color":"#e10600","fill-opacity":.12}});map.addLayer({id:"new-line",type:"line",source:"new-zone",paint:{"line-color":"#e10600","line-width":3,"line-dasharray":[2,1]}})}renderMarkers();if(centerMarker)centerMarker.remove();if(center){const ce=document.createElement("div");ce.className="center-marker";ce.title="Centre de la zone";centerMarker=new maplibregl.Marker({element:ce,draggable:true}).setLngLat([center.lng,center.lat]).addTo(map);centerMarker.on("drag",()=>{const c=centerMarker.getLngLat();center={lng:c.lng,lat:c.lat};updateCenterRead()})}updateCenterRead()}'
          if old_render in c:
              c = c.replace(old_render, new_render, 1)
          create.write_text(c, encoding="utf-8")

      - name: Commit patched UI
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add commune/index.html commune/zone-create.html
          git commit -m "feat(admin): add new zone creation entry"
          git push
