name: Load template admin UI

on:
  push:
    paths:
      - 'commune/templates-admin.js'

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject template admin script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('commune/index.html')
          text = path.read_text(encoding='utf-8')
          tag = '<script src="templates-admin.js"></script>'
          if tag not in text:
              marker = '</body>'
              if marker not in text:
                  raise SystemExit('Missing </body> marker')
              text = text.replace(marker, tag + '\n' + marker, 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit injected UI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add commune/index.html
          git diff --cached --quiet || git commit -m 'build: wire template admin UI'
          git push
