name: Wire boundary snapping
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add snapping script to geometry editors
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['commune/geometry.html', 'commune/zone-create.html']:
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              tag = '<script src="geometry-snapping.js"></script>'
              if tag not in s:
                  s = s.replace('</body>', tag + '\n</body>')
                  p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add commune/geometry.html commune/zone-create.html
          git diff --cached --quiet || git commit -m 'feat(admin): wire optional boundary snapping'
          git push
